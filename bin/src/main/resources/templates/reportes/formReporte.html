<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/layout :: head}"></head>

<body>
	<header th:replace="~{layout/layout :: header}"></header>
	<div class="container py-2 mx-4">
		<div class="card bg-light" style="width: 112%;">
			<!-- <div class="card-header" th:text="${titulo}"></div> -->
			<div class="card-body">
				<!-- Titulo - fecha y Linea divisoria ---------------------------------------------------------------->
				<div
					style="display: flex; justify-content: space-between; border-bottom: 1px solid lightgray; width: 100%;">

					<h4 th:text="${titulo}" class="text-danger" style="font-family: Arial; font-size: 20px"></h4>

					<!-- fecha y hora--------------------------------------------------------------->
					<div class="col-sm-2"
						style="padding: 1px; position: absolute; top: 7px; right: 15px; width: 265px;">
						<input class="form-control bg-light float-right text-danger" type="text" id="fechaHora"
							style="height: 34px; border: 0; outline: 0; box-shadow: none;" name="fechaHora" readonly>
					</div>
					<!------------------- fin fecha y hora ------------------------------------------>
				</div>
				<!-- fin linea --------------------------------------------------------------------------------------->


				<!-- ESPACIO DESPUES DE LA LINEA ------->
				<h1 class="text-secondary pb-0"></h1>
				<!-------------------------------------->

				<div class="mb-1 row"
					style="display: flex; justify-content: space-between; align-items: center;  margin-top: -4px;">
					<label class="col-sm text-primary"><input class="form-check-input" type="checkbox"
							id="isCheckReporteFechas" name="isCheckReporteFechas" value="true"
							th:onclick="uncheckOther(this)" style="width: 18px; height: 18px;">&nbsp;Reporte
						por Fecha</label> <label class="col-sm text-primary"><input class="form-check-input"
							type="checkbox" th:onclick="uncheckOther(this)" id="isCheckReporteVigente"
							name="isCheckReporteVigente" value="true" style="width: 18px; height: 18px;">&nbsp;Reporte
						Vigente</label> <label class="col-sm text-primary"><input class="form-check-input"
							type="checkbox" th:onclick="uncheckOther(this)" id="isCheckReporteHistorico"
							name="isCheckReporteHistorico" value="true" style="width: 18px; height: 18px;">&nbsp;Reporte
						Historico</label>

				</div>


				<!-- Linea divisoria cn margren inferion 15 px-------------------------------------------------------->
				<div
					style="display: flex; justify-content: space-between; border-bottom: 1px solid lightgray; width: 100%; margin-bottom: 10px;">
				</div>
				<!-- fin linea --------------------------------------------------------------------------------------->

				<div class="modal-body">
					<form id="myForm" th:action="@{/reportes/formReporte}" th:object="${turno}" method="post">
						<!-- ID PROFESIONAL Y ESPECIALIDAD --------------------------->
						<!-- <input type="hidden" id="profesionalId" name="profesionalId" />
						<input type="hidden" id="especialidadId" name="especialidadId" /> -->
						<!------------------------------------------------------------>
						<div class="mb-3 row">
							<!-- label para Buscar Profesional-->
							<div class="col-sm-2" style="display: flex; align-items: center;">
								<img th:src="@{/images/search-doctor.png}" width="17" height="17"
									style="margin-right: 10px;"> <span for="profesional">Selección del Medico:</span>
							</div>

							<div class="col-sm-3">
								<!-- ancho del campo -->
								<select class="form-select" id="profesional" name="profesional"
									style="height: 35px; font-size: 15px" th:onchange="cargarEspecialidades()">
									<!-- Renderizar opciones desde el controlador -->
									<option value="" disabled>Seleccione una opción...</option>

									<option th:each="profesional : ${profesionales}" th:value="${profesional.id}"
										th:text="${profesional.codigo} + ' - ' + ${profesional.apellido} + ' ' + ${profesional.nombre}">
								</select>
							</div>

							<!-- label para Buscar Especialidad-->
							<div class="col-sm-2" style="display: flex; align-items: center;">
								<img th:src="@{/images/search-doctor.png}" width="17" height="17"
									style="margin-right: 10px;"> <span for="especialidad">Especialidad Asociada:</span>
							</div>
							<div class="col-sm-3">
								<!-- ancho del campo -->
								<select id="especialidad" name="especialidad" class="form-select"
									style="height: 35px; font-size: 15px" th:onclick="existeEspecialidad()">
									<!-- <option th:each="especialidad : ${especialidades}"
										th:value="${especialidad.id}"
										th:text="${especialidad.especialidadNombre}"></option> -->
								</select>
							</div>

							<div class="col-sm" style="display: flex; align-items: center; text-align: center;">
								<label class="col-sm text-warning">Validado (ok) <input class="form-check-input"
										type="checkbox" id="isCheckProfEsp" name="isCheckProfEsp" value="true"
										disabled="disabled" style="width: 15px; height: 15px;"></label>
							</div>

						</div>
						<div class="mb-3 row">
							<div class="col-sm-2" style="display: flex; align-items: center;">
								<img th:src="@{/images/fechaReporte.png}" width="17" height="17"
									style="margin-right: 10px;"> <span for="fechaInicial">Fecha
									Inicial Reporte:</span>
							</div>
							<!-- <label class="col-sm-2 col-form-label" for="fechaInicial">Fecha
								Inicial del Reporte:</label> -->
							<div class="col-sm-3">
								<input type="date" class="form-control" id="fechaInicio" name="fechaInicio" />
							</div>

							<div class="col-sm-2" style="display: flex; align-items: center;">
								<img th:src="@{/images/fechaReporte.png}" width="17" height="17"
									style="margin-right: 10px;"> <span for="fechaFinal">Fecha
									Final Reporte:</span>
							</div>
							<!-- <label class="col-sm-2 col-form-label" for="fechaFinal">Fecha
								Final del Reporte:</label> -->
							<div class="col-sm-3">
								<input type="date" class="form-control" id="fechaFinal" name="fechaFinal" />
							</div>

						</div>

						<!-- LINEA Y ESPACIO DESPUES------------------------------------------------------------------------------>
						<div class="text-secondary"
							style="display: flex; justify-content: space-between; border-bottom: 1px solid lightgray; width: 100%;">
						</div>
						<h1 class="text-secondary pb-0"></h1>
						<!------------------------------------------------------------------------------------------------------------------->
						<div style="display: flex; flex-wrap: wrap; justify-content: space-between; margin-top: -8px;">
							<input type="radio" id="turnoCancelado" name="reportes" value="turnoCancelado"> <label
								for="turnoCancelado" style="margin-left: -40px; color: purple;">Turnos
								Cancelados</label> <input type="radio" id="sobreturnoCancelado" name="reportes"
								value="sobreturnoCancelado">
							<label for="sobreturnoCancelado" style="margin-left: -40px; color: purple;">Sobreturnos
								Cancelados</label> <input type="radio" id="planillaCancelada" name="reportes"
								value="planillaCancelada">
							<label for="planillaCancelada" style="margin-left: -40px; color: purple;">Planillas
								Canceladas</label> <input type="radio" id="vinculacion" name="reportes"
								value="vinculacion">
							<label for="vinculacion" style="margin-left: -40px; color: purple;">Vinculacion</label>
							<input type="radio" id="movimiento" name="reportes" value="movimiento"> <label
								for="movimiento" style="margin-left: -40px; color: purple;">Movimientos</label>
							<input type="radio" id="planilla" name="reportes" value="planilla"> <label for="planilla"
								style="margin-left: -40px; color: purple;">Planillas</label>
							<input type="radio" id="turno" name="reportes" value="turno"> <label for="turno"
								style="margin-left: -40px; color: purple;">Turnos</label>
							<input type="radio" id="sobreturno" name="reportes" value="sobreturno"> <label
								for="sobreturno" style="margin-left: -40px; color: purple;">Sobreturnos</label>
						</div>
						<!-- ESPACIO DESPUES DE LA LINEA -------------------------------------------------------------------------------->
						<div
							style="display: flex; justify-content: space-between; border-bottom: 1px solid lightgray; width: 100%;">
						</div>
						<h1 class="text-secondary pb-0"></h1>
						<!--------------------------------------------------------------------------------------------------------------->
						<div class="table-responsive" style="height: 250px; overflow-y: auto">
							<table class="table table-bordered" id="tablaReportes">
								<!-- columnas -->
								<thead class="table-secondary">
								
									<tr>
										<!-- Las cabeceras se construirán aqui con JavaScript -->
									</tr>
								</thead>

								<!-- filas -->
								<tbody>
									<!-- Las filas de datos se añadirán aquí -->
								</tbody>

							</table>
						</div>

						<div class="d-flex mb-3" style="margin-top: 20px;">
									<!--th:onclick="existePlanillaActiva()"  verifica planillaActiva y campos del formulario. -->
									<button type="button" class="btn btn-primary btn-lg flex-fill me-1" id="btnGenerarReporte"
										th:onclick="renderizarReporte()">Mostrar Turnos</button>
									<!-- boton oculto pero funcional el th:onclick -->
									<button type="button" class="btn btn-primary btn-lg flex-fill me-1" id="btnImprimirPdf" th:onclick="imprimirReportePdf();"
										target="_blank">Imprimir
										en PDF</button>
								</div>
					</form>
				</div>
			</div>
		</div>
		
		<!--<div class="d-flex mb-3" style="margin-top: 20px;">
			th:onclick="existePlanillaActiva()"  verifica planillaActiva y campos del formulario. 
			<button type="button" class="btn btn-primary btn-lg flex-fill me-1" id="btnGenerarReporte"
				th:onclick="renderizarReporte()">Mostrar Turnos</button>
			 boton oculto pero funcional el th:onclick 
			<a class="btn btn-primary btn-lg flex-fill me-1" id="btnImprimirPdf" th:onclick="imprimirReportePdf();"
				target="_blank">Imprimir
				en PDF</a>
		</div>-->


	</div>
	<footer th:replace="~{layout/layout :: footer}"></footer>

	<script th:replace="reportes/js/load-combobox-vinculacion-reportes :: javascript"></script>
	<script th:replace="reportes/js/funcionesParaReportes :: javascript"></script>

	<script>
		// FUNCION PARA Fecha y Hora AL [CARGAR LA PAGINA]
		function actualizarFechaHora() {
			const fechaHoraActual = new Date();
			const opciones = {
				weekday: 'long',
				timeZone: 'America/Argentina/Buenos_Aires'
			};
			const diaSemana = fechaHoraActual.toLocaleDateString('es-AR',
				opciones);
			const fechaHoraFormateada = diaSemana.toUpperCase() + ' '
				+ fechaHoraActual.toLocaleString();
			document.getElementById("fechaHora").value = fechaHoraFormateada;
		}

		// Actualizar la fecha y hora cada segundo (FECHA Y HORA)
		try {
			setInterval(actualizarFechaHora, 1000);
		} catch (error) {
			console
				.error(
					"Se produjo un error en setInterval(actualizarFechaHora, 1000):",
					error);
		}

		// Inicializar la fecha y hora al cargar la página (FECHA Y HORA)
		try {
			actualizarFechaHora();
		} catch (error) {
			console.error("Se produjo un error en actualizar Fecha Hora:", error);
		}
	</script>
	
	
	<script>
		//duplicamos valor en FechaFinal mientras escribimos la fechaInicial.
	  const fecha1 = document.getElementById('fechaInicio');
	  const fecha2 = document.getElementById('fechaFinal');

	  fecha1.addEventListener('input', function() {
	    fecha2.value = this.value; // Asigna el valor del primer input al segundo
	  });
	</script>
	
</body>

</html>
