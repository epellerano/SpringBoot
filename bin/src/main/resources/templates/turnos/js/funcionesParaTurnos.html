			//Convertimos a español los dias de la semana de moment.
			function ObtenerDiaEspañol(date) {
  			const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  			return days[moment(date).day()];
}

			  function obtenerObservaciones() {
				 //verificamos objeto vacio
				 
				 //Variables				 
				 const profId = $("#profesional").val();
				 const EspecId = $("#especialidad").val();	
				 
				 //Continuamos
				 $.ajax({

	                    success: function(data) {
	                    		  data.forEach(function(Vinculacion) { 
	                    			  if(Vinculacion.observacion.trim() !== ""){
	  	                        	//mostramos las observaciones del profesional en el parrafo. 
	  	                        	$("#observaciones").html(Vinculacion.observacion);
	                    			  }else{
	                    				// Si esta vacio, muestra un texto de error en el <p>.
	                    				document.getElementById('observaciones').style.textAlign = "center";
	    	                    	      $("#observaciones").text("* NO EXISTEN OBSERVACIONES DEL PROFESIONAL *"); 
	                    			  }
	  	                        });
	                        //$("#horariosAtencionTableBody").empty();	                      
	                    },
	                    error: function(error) {
	                        console.log(error);
	                    }
	                });
			 }
			
			  function isEmpty(obj) {
				  for (const prop in obj) {
				    if (Object.hasOwn(obj, prop)) {
				      return false;
				    }
				  }

				  return true;
				}

		//FUNCION PARA RESALTAR LA FILA DE TABLE Turnos LibresTodos al hacer click		
		  document.addEventListener('DOMContentLoaded', function() {
			  const tabla = document.getElementById('turnosLibresTodos');

			  tabla.addEventListener('click', function(event) {
				  if (event.target.closest('tr').parentNode.tagName !== 'THEAD') {
				  // Remover resaltado anterior siempre y cuando no sea click en el Encabezado.
				    const filas = tabla.querySelectorAll('td');
				    filas.forEach(fila => {
				      fila.classList.remove('selected-row');
				    });
				  }

			    //Resaltar la fila actual
			    const filaClickeada = event.target.closest('tr');
			    if (filaClickeada  && filaClickeada.parentNode.tagName !== 'THEAD') {
			        const celdas = filaClickeada.querySelectorAll('td');
			        celdas.forEach(celda => {
			            celda.classList.add('selected-row');			          
			        });
			      //Marcamos el checkBox
			      marcarCheckTurnoSeleccionado();
			      //Obtenemos el valor de la fila clickeada de acuerdo al indice establecido.
				    const filaClick = event.target.closest('tr');
				    const celda = filaClick.querySelectorAll('td');
				    //enviamos el id de planillaDetalle y planillaCabecera a los Input type:hidden de formTurno.html			    
  					const planillaDetId = document.getElementById('planillaDetId'); // Acceder al elemento de la vista.
  					const planillaCabId = document.getElementById('planillaCabId'); // Acceder al elemento de la vista.
  					const rangoFechaHora = document.getElementById('rangoFechaHora'); // Acceder al elemento de la vista.
  					
  					planillaDetId.setAttribute('value', celda[0].innerText); // id_planilladetalle
  					planillaCabId.setAttribute('value', celda[1].innerText); // id_planillacabecera
  					rangoFechaHora.setAttribute('value', celda[2].innerText); // Rango Fecha Hora
  					rangoFechaHoraSeleccionada.setAttribute('value', celda[2].innerText); // Rango Fecha Hora para variable global
  					
				    //alert('Dato clickeado: ' + celda[0].innerText); //[0]id_planilladetalle  [1] id_planillacabecera
			    }
			    //ELSE
			  });
			});

		//FUNCION PARA Fecha y Hora AL [CARGAR LA PAGINA]
		function actualizarFechaHora() {		
			const fechaHoraActual = new Date();
			const opciones = {
				weekday : 'long',
				timeZone : 'America/Argentina/Buenos_Aires'
			};
			const diaSemana = fechaHoraActual.toLocaleDateString('es-AR',
					opciones);
			const fechaHoraFormateada = diaSemana.toUpperCase() + ' '
					+ fechaHoraActual.toLocaleString();
			document.getElementById("fechaHora").value = fechaHoraFormateada;
		}

		// Actualizar la fecha y hora cada segundo (FECHA Y HORA)
		try {
			setInterval(actualizarFechaHora, 1000);
			} catch (error) {
  				console.error("Se produjo un error en setInterval(actualizarFechaHora, 1000):", error);
			}	
		
		// Inicializar la fecha y hora al cargar la página (FECHA Y HORA)
		try {
