<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" xmlns:sec="http://thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/layout :: head}">
    <!-- Font Awesome 7 Local -->
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
</head>
<style>
    /* --- ESTÉTICA SIGAT PREMIUM (UNIFICADA) --- */
    .header-sigat-modern {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 20px;
        margin-bottom: 30px;
        border-bottom: 1px solid #e2e8f0;
        position: relative;
    }

    .header-sigat-modern::after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: 0;
        width: 150px;
        height: 3px;
        background-color: #0d6efd;
        border-radius: 2px;
    }

    .icon-shape {
        width: 50px;
        height: 50px;
        background-color: #eef2ff;
        color: #0d6efd;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        font-size: 1.5rem;
    }

    .system-tag {
        font-size: 0.65rem;
        font-weight: 800;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        display: block;
        margin-bottom: -2px;
    }

    .title-main {
        font-family: 'Segoe UI', Arial, sans-serif;
        font-weight: 700;
        color: #1e293b;
        font-size: 1.75rem;
        margin: 0;
    }

    .subtitle-main {
        font-size: 0.85rem;
        color: #94a3b8;
        font-weight: 500;
    }

    /* --- ESTILOS DE TABLA DE AGENDAS --- */
    .table thead th {
        background-color: #f8fafc;
        color: #475569;
        text-transform: uppercase;
        font-size: 0.65rem;
        font-weight: 800;
        letter-spacing: 0.5px;
        padding: 12px 8px;
        vertical-align: middle;
    }

    /* Colores para diferenciar los turnos (Mantenidos del diseño original) */
    .col-mañana { background-color: #f0fdf4 !important; color: #166534 !important; border-bottom: 2px solid #bbf7d0 !important; }
    .col-tarde { background-color: #f0f9ff !important; color: #075985 !important; border-bottom: 2px solid #bae6fd !important; }

    .badge-clinico {
        background-color: #d1fae5;
        color: #065f46;
        border: 1px solid #10b981;
        padding: 0.3em 0.6em;
        font-weight: 700;
        text-transform: uppercase;
        border-radius: 4px;
        font-size: 0.7rem;
    }

    .badge-estado {
        padding: 0.4em 0.8em;
        border-radius: 50px;
        font-weight: 700;
        font-size: 0.65rem;
    }

    /* Botones de acción minimalistas */
    .btn-action-link {
        color: #64748b;
        transition: all 0.2s;
    }
    .btn-action-link:hover { color: #0d6efd; }
    .btn-delete-link:hover { color: #dc3545; }
</style>

<body class="bg-light">

    <header th:replace="~{layout/layout :: header}"></header>

    <div class="container-fluid px-lg-5 py-4">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-lg-5">

                <!-- CABECERA PREMIUM REDISEÑADA (ESTILO MOVIMIENTOS) -->
                <div class="header-sigat-modern">
                    <div class="d-flex align-items-center">
                        <div class="icon-shape me-3 shadow-sm">
                            <i class="fa-solid fa-calendar-days"></i>
                        </div>
                        <div>
                            <!-- <span class="system-tag">SIGAT • PLANIFICACIÓN HORARIA</span> -->
                            <h2 class="title-main" th:text="${titulo}"></h2>
                            <span class="subtitle-main">SIGAT • Control centralizado de agendas médicas y rangos de atención</span>
                        </div>
                    </div>
                    
                    <a sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/planillacabecera/formPlanillaCabecera}" 
                       class="btn btn-primary fw-bold shadow-sm px-4 py-2 rounded-3">
                        <i class="fa-solid fa-calendar-plus me-2"></i>NUEVA AGENDA
                    </a>
                </div>

                <!-- TABLA RESPONSIVE -->
                <div class="table-responsive">
                    <table class="table table-hover align-middle border">
                        <thead>
                            <!-- Fila de Encabezados Agrupados -->
                            <tr>
                                <th colspan="6" class="text-center border-end">Identificación y Vigencia</th>
                                <th colspan="3" class="text-center col-mañana border-end"><i class="fa-solid fa-sun me-1"></i> Turno Mañana</th>
                                <th colspan="3" class="text-center col-tarde border-end"><i class="fa-solid fa-moon me-1"></i> Turno Tarde</th>
                                <th colspan="2" class="text-center">Gestión</th>
                            </tr>
                            <tr>
                                <th class="text-center" sec:authorize="hasRole('ROLE_USER')">Ficha</th>
                                <th>Profesional</th>
                                <th>Especialidad</th>
                                <th>Día</th>
                                <th>Inicio</th>
                                <th class="border-end">Fin</th>
                                <th class="col-mañana">Desde</th>
                                <th class="col-mañana">Hasta</th>
                                <th class="col-mañana border-end text-center">Min</th>
                                <th class="col-tarde">Desde</th>
                                <th class="col-tarde">Hasta</th>
                                <th class="col-tarde border-end text-center">Min</th>
                                <th class="text-center">Estado</th>
                                <th class="text-center" sec:authorize="hasRole('ROLE_ADMIN')">Baja</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="planillacab: ${planillacabecera}">
                                <!-- Ver Detalle -->
                                <td class="text-center" sec:authorize="hasRole('ROLE_USER')">
                                    <a th:href="@{/planilladetalle/verPlanillaDetalle/} + ${planillacab.id}" class="btn-action-link">
                                        <i class="fa-solid fa-circle-info fa-lg"></i>
                                    </a>
                                </td>

                                <!-- Datos Principales -->
                                <td class="fw-bold text-dark" th:text="${planillacab.profesional.apellido} + ' ' + ${planillacab.profesional.nombre}"></td>
                                <td>
                                    <small class="text-muted fw-bold" th:text="${planillacab.especialidad.especialidadNombre}"></small>
                                </td>
                                <td>
                                    <span class="badge badge-clinico" th:text="${planillacab.dia.nombre}"></span>
                                </td>
                                <td th:text="${#dates.format(planillacab.fechaInicio,'dd/MM/yyyy')}"></td>
                                <td class="border-end" th:text="${#dates.format(planillacab.fechaFinal,'dd/MM/yyyy')}"></td>

                                <!-- Turno Mañana -->
                                <td class="col-mañana" th:text="${planillacab.horaInicialR1}"></td>
                                <td class="col-mañana" th:text="${planillacab.horaFinalR1}"></td>
                                <td class="col-mañana border-end text-center fw-bold" th:text="${planillacab.intervaloR1}"></td>

                                <!-- Turno Tarde -->
                                <td class="col-tarde" th:text="${planillacab.horaInicialR2}"></td>
                                <td class="col-tarde" th:text="${planillacab.horaFinalR2}"></td>
                                <td class="col-tarde border-end text-center fw-bold" th:text="${planillacab.intervaloR2}"></td>

                                <!-- Estado -->
                                <td class="text-center">
                                    <span class="badge badge-estado shadow-sm" 
                                          th:classappend="${planillacab.estado.nombre == 'Activa' ? 'bg-success' : 'bg-secondary'}"
                                          th:text="${planillacab.estado.nombre}"></span>
                                </td>

                                <!-- Acciones Admin -->
                                <td class="text-center" sec:authorize="hasRole('ROLE_ADMIN')">
                                    <a th:href="@{/planillacabecera/eliminarPlanillaCabecera/} + ${planillacab.id}" 
                                       class="btn-action-link btn-delete-link" 
                                       th:onclick="return confirm('¿Está seguro que desea eliminar esta planilla de agenda?');" title="Eliminar">
                                        <i class="fa-solid fa-trash-can fa-lg"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- PAGINADOR -->
                <div class="d-flex justify-content-between align-items-center mt-4">
                    <p class="small text-muted mb-0">Planificación de recursos médicos SIGAT</p>
                    <nav th:replace="~{paginator-nav :: paginator}"></nav>
                </div>

            </div>
        </div>
    </div>

    <footer th:replace="~{layout/layout :: footer}"></footer>
</body>
</html>
