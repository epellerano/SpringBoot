<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head th:replace="layout/layout :: head ">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<style>
    /* SIGAT: MEDICAL ELITE - COLOR & SIZE REFINEMENT */
    .viewport-container {
        min-height: calc(100vh - 70px);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 15px 10px 10px 10px;
    }
    .container-custom-width {
        max-width: 1450px;
        width: 98%;
        margin: 0 auto;
    }
    .card-full {
        width: 100%;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05) !important;
    }
    .fa-solid, .fa-user-md, .fa-stethoscope, .fa-calendar-day,
    .fa-calendar-check, .fa-clock, .fa-sync, .fa-save,
    .fa-arrow-rotate-left, .fa-wand-sparkles, .fa-database {
        color: #333333 !important;
    }
    .text-blue-clinical {
        color: #0d6efd !important;
        font-weight: 700;
    }
    .custom-section-box {
        background-color: #f8fafc;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 8px 15px;
        margin-bottom: 8px;
    }
    .shift-card-compact {
        border-radius: 8px;
        padding: 6px 12px;
        border: 1px solid #e2e8f0;
        border-left: 5px solid;
    }
    .card-mañana { background-color: #f0fdf4; border-left-color: #198754; }
    .card-tarde { background-color: #f0f9ff; border-left-color: #0d6efd; }
    .table-preview-fixed {
        height: 36vh;
        min-height: 200px;
        overflow-y: auto;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: white;
    }
    .header-tabla-generada { background-color: #0f5132 !important; color: white !important; }
    .header-tabla-db { background-color: #2c3e50 !important; color: white !important; }
    .btn-limpiar-warning-slim {
        font-size: 0.62rem !important;
        height: 18px !important;
        padding: 0 6px;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 3px;
        border-radius: 3px;
        border: none;
        background-color: #ffc107 !important;
        color: #000 !important;
    }
    .form-control, .form-select, .btn { font-size: 0.9rem !important; height: 32px !important; }
    .btn-clinica-solid { background-color: #157347 !important; color: white !important; border: none; font-weight: 700; }
    .btn-custom-listado { background-color: transparent; color: #4b5563; border: 2px solid #9ca3af; font-weight: 700; }
</style>

<body class="bg-light">
    <header th:replace="layout/layout :: header "></header>

    <div class="viewport-container">
        <div class="container-custom-width">
            <div class="card card-full shadow">
                <div class="card-body p-3">

                    <form th:action="@{/planillacabecera/formPlanillaCabecera}" th:object="${planillacabecera}" method="post" id="form">
                        
                        <!-- ENCABEZADO DENTRO DEL FORM -->
                        <div class="header-clinica d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom">
                            <div class="d-flex align-items-center">
                                <div class="d-flex align-items-center justify-content-center rounded-3 me-3" style="width: 45px; height: 45px; background-color: #e8f5e9; border: 1px solid #157347;">
                                    <i class="bi bi-calendar-check-fill" style="font-size: 1.8rem; color: #157347;"></i>
                                </div>
                                <div>
                                    <h4 th:text="${titulo}" class="fw-bold text-dark mb-0"></h4>
                                    <p class="text-muted mb-0 small text-uppercase" style="font-size: 0.6rem; font-weight: 800; color: #157347;">SIGAT • Gestión Profesional</p>
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-2 bg-white p-1 px-3 rounded-pill border shadow-sm">
                                <div class="form-check form-switch m-0">
                                    <!-- CORRECCIÓN: AGREGADO NAME Y VALUE -->
                                    <input class="form-check-input" type="checkbox" id="isCheckBoxes" name="isCheckBoxes" value="true"> 
                                    <label class="fw-bold text-success mb-0 small" style="font-size: 0.7rem;" for="isCheckBoxes">MODO BOXES</label>
                                </div>
                                <select class="form-select" id="optionBox" name="optionBox" style="width: 60px; text-align: center; border-radius: 20px;" disabled>
                                    <option th:each="i : ${#numbers.sequence(0, 8)}" th:value="${i}" th:text="${i}"></option>
                                </select>
                            </div>
                        </div>

                        <!-- FILA 1: PROFESIONAL Y ESPECIALIDAD -->
                        <div class="row g-2 mb-2">
                            <div class="col-md-6">
                                <label class="small fw-bold text-blue-clinical mb-0">Profesional</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-user-md"></i></span> 
                                    <select class="form-select" th:field="*{profesional.id}" id="profesional" onchange="cargarEspecialidades()">
                                        <option value="" disabled selected>Seleccione...</option>
                                        <option th:each="p : ${profesionales}" th:value="${p.id}" th:text="${p.apellido} + ' ' + ${p.nombre}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="small fw-bold text-blue-clinical mb-0">Especialidad</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-stethoscope"></i></span> 
                                    <select id="especialidad" class="form-select" th:field="*{especialidad.id}" onclick="existeEspecialidad()"></select>
                                </div>
                            </div>
                        </div>

                        <!-- BOX FECHAS -->
                        <div class="custom-section-box shadow-sm">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="text-blue-clinical"><i class="fa-solid fa-calendar-day"></i> FECHA DE INICIO</label> 
                                    <input type="date" th:field="*{fechaInicio}" class="form-control" id="fechaInicio" />
                                </div>
                                <div class="col-md-4">
                                    <label class="text-blue-clinical"><i class="fa-solid fa-calendar-check"></i> FECHA FINAL</label> 
                                    <input type="date" th:field="*{fechaFinal}" class="form-control" id="fechaFinal" />
                                </div>
                                <div class="col-md-4">
                                    <label class="text-blue-clinical"><i class="fa-solid fa-clock"></i> SELECCIONE EL DÍA</label> 
                                    <select class="form-select" th:field="*{dia}">
                                        <option th:each="d : ${dias}" th:value="${d.id}" th:text="${d.nombre}"></option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- BOX TURNOS -->
                        <div class="custom-section-box shadow-sm">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="shift-card-compact card-mañana">
                                        <div class="d-flex justify-content-between align-items-center mb-1">
                                            <div class="form-check form-switch">
                                                <!-- CORRECCIÓN: AGREGADO NAME Y VALUE -->
                                                <input class="form-check-input" type="checkbox" id="isCheckMañana" name="isCheckMañana" value="true"> 
                                                <label class="fw-bold text-success small">MAÑANA</label>
                                            </div>
                                            <button type="button" class="btn-limpiar-warning-slim" id="limpiarTM"><i class="fa-solid fa-broom"></i> LIMPIAR</button>
                                        </div>
                                        <div class="row g-1">
                                            <div class="col-4"><input type="time" th:field="*{horaInicialR1}" class="form-control" id="horaInicialR1" disabled /></div>
                                            <div class="col-4"><input type="time" th:field="*{horaFinalR1}" class="form-control" id="horaFinalR1" disabled /></div>
                                            <div class="col-4">
                                                <select class="form-select" th:field="*{intervaloR1}" id="intervaloR1" disabled onchange="generarRangoHorario()">
                                                    <option value="" selected>Int.</option>
                                                    <option th:each="m : ${ {1, 5, 10, 15, 20, 30, 45, 60} }" th:value="${m}" th:text="${m} + 'm'"></option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="shift-card-compact card-tarde">
                                        <div class="d-flex justify-content-between align-items-center mb-1">
                                            <div class="form-check form-switch">
                                                <!-- CORRECCIÓN: AGREGADO NAME Y VALUE -->
                                                <input class="form-check-input" type="checkbox" id="isCheckTarde" name="isCheckTarde" value="true"> 
                                                <label class="fw-bold text-primary small">TARDE</label>
                                            </div>
                                            <button type="button" class="btn-limpiar-warning-slim" id="limpiarTT"><i class="fa-solid fa-broom"></i> LIMPIAR</button>
                                        </div>
                                        <div class="row g-1">
                                            <div class="col-4"><input type="time" th:field="*{horaInicialR2}" class="form-control" id="horaInicialR2" disabled /></div>
                                            <div class="col-4"><input type="time" th:field="*{horaFinalR2}" class="form-control" id="horaFinalR2" disabled /></div>
                                            <div class="col-4">
                                                <select class="form-select" th:field="*{intervaloR2}" id="intervaloR2" disabled onchange="generarRangoHorario()">
                                                    <option value="" selected>Int.</option>
                                                    <option th:each="m : ${ {5, 10, 15, 20, 30, 45, 60} }" th:value="${m}" th:text="${m} + 'm'"></option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- TABLAS PREVIA -->
                        <div class="row g-2 mb-2">
                            <div class="col-md-6">
                                <div class="table-preview-fixed shadow-sm">
                                    <table class="table table-sm table-hover mb-0" id="rango">
                                        <thead><tr class="header-tabla-generada"><th class="ps-3"><i class="fa-solid fa-wand-sparkles"></i> VISTA PREVIA</th></tr></thead>
                                        <tbody></tbody>
                                    </table>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="table-preview-fixed shadow-sm">
                                    <table class="table table-sm table-hover mb-0" id="TablaMysql">
                                        <thead><tr class="header-tabla-db"><th class="ps-3"><i class="fa-solid fa-database"></i> BASE DE DATOS</th></tr></thead>
                                        <tbody></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- ACCIONES -->
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-clinica-solid flex-grow-1" id="btnGenerar" onclick="generarRangoHorario()">
                                <i class="fa-solid fa-sync"></i> GENERAR RANGO
                            </button>
                            <button type="submit" id="btnGuardar" class="btn btn-clinica-solid flex-grow-1" onclick="validarRango()" disabled>
                                <i class="fa-solid fa-save"></i> GUARDAR PLANILLA
                            </button>
                            <a th:href="@{/planillacabecera/listarPlanillaCabecera}" class="btn btn-custom-listado px-5 d-flex align-items-center">
                                <i class="fa-solid fa-arrow-rotate-left"></i> VOLVER
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="layout/layout :: footer "></footer>
    
    <!-- SCRIPTS -->
    <script th:replace="planillas/js/load-combobox-vinculacion :: javascript"></script>
    <script th:replace="planillas/js/generarRangoHorario :: javascript"></script>
    <script th:replace="planillas/js/validacionRango :: javascript"></script>
    <script th:inline="javascript">
        const btnGuardar = document.getElementById('btnGuardar');
        const originalGenerarRango = window.generarRangoHorario;

        window.generarRangoHorario = function() {
            if(typeof originalGenerarRango === 'function') originalGenerarRango();
            const int1 = document.getElementById('intervaloR1').value;
            const int2 = document.getElementById('intervaloR2').value;
            const checkM = document.getElementById('isCheckMañana').checked;
            const checkT = document.getElementById('isCheckTarde').checked;

            if ((checkM && int1 !== "") || (checkT && int2 !== "")) {
                btnGuardar.disabled = false;
            } else {
                btnGuardar.disabled = true;
            }
        };        

        const setupTurno = (checkId, inputsIds, btnId) => {
          const check = document.getElementById(checkId);
          const inputs = inputsIds.map(id => document.getElementById(id));
          const btn = document.getElementById(btnId);
          check.addEventListener('change', () => inputs.forEach(i => i.disabled = !check.checked));
          btn.addEventListener('click', () => {
              inputs.forEach(i => { i.value = (i.type === 'time' ? '00:00' : ''); i.disabled = true; });
              check.checked = false;
              btnGuardar.disabled = true;
              if(typeof generarRangoHorario === 'function') generarRangoHorario();
          });
        };
        
        setupTurno('isCheckMañana', ['horaInicialR1', 'horaFinalR1', 'intervaloR1'], 'limpiarTM');
        setupTurno('isCheckTarde', ['horaInicialR2', 'horaFinalR2', 'intervaloR2'], 'limpiarTT');    
        
        const isCheckBoxes = document.getElementById("isCheckBoxes");
        isCheckBoxes.addEventListener("click", () => {
         if (isCheckBoxes.checked) {
             document.getElementById('optionBox').disabled = false;
             document.getElementById('isCheckMañana').checked = true;
             ['horaInicialR1', 'horaFinalR1', 'intervaloR1'].forEach(id => document.getElementById(id).disabled = false);
         } else {
             document.getElementById('optionBox').disabled = true;
         }
        });
    </script>
</body>
</html>
