<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head th:replace="~{layout/layout :: head}">
<link rel="stylesheet" th:href="@{/css/all.min.css}">
</head>
<style>

/* BOTÓN BUSCAR (Azul / Pizarra Pro) */
button#btnBuscarDatos {
	background-color: #334155 !important; /* Gris pizarra muy elegante */
	color: #ffffff !important;
	border: none !important;
	height: 45px !important;
	border-radius: 8px !important;
	font-weight: 700 !important;
	transition: all 0.3s ease !important;
	display: flex !important;
	align-items: center !important;
	justify-content: center !important;
}

button#btnBuscarDatos:hover {
	background-color: #1e293b !important;
	transform: translateY(-2px) !important;
	box-shadow: 0 4px 12px rgba(30, 41, 59, 0.2) !important;
}

/* BOTÓN CANCELAR (Rojo Alerta Elite) */
button#btnCancelarTurnos {
	background-color: #ef4444 !important; /* Rojo vibrante de alerta */
	color: #ffffff !important;
	border: none !important;
	height: 45px !important;
	border-radius: 8px !important;
	font-weight: 700 !important;
	transition: all 0.3s ease !important;
	display: flex !important;
	align-items: center !important;
	justify-content: center !important;
}

button#btnCancelarTurnos:hover {
	background-color: #dc2626 !important;
	transform: translateY(-2px) !important;
	box-shadow: 0 8px 15px rgba(239, 68, 68, 0.3) !important;
}

/* SIGAT: MEDICAL ELITE - AJUSTE DE MARGEN SUPERIOR */
.viewport-container {
	min-height: calc(100vh - 70px);
	display: flex;
	flex-direction: column;
	align-items: center;
	/* Aumentamos de 2px a 25px para que se despegue del logo del layout */
	padding: 25px 0 10px 0;
}

.container-custom-width {
	max-width: 98%;
	width: 98%;
	margin: 0 auto;
}

.card-full {
	width: 100%;
	border-radius: 12px;
	border: 1px solid #e2e8f0;
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08) !important;
}

.header-clinica {
	border-bottom: 2px solid #dee2e6;
	padding-bottom: 10px;
	margin-bottom: 12px;
	display: flex;
	align-items: center;
	justify-content: space-between;
}

.titulo-grande {
	font-size: 1.6rem !important;
	font-weight: 600;
	color: #1a202c;
	letter-spacing: -0.5px;
}

.subtitulo-sigat {
	font-size: 0.75rem !important;
	font-weight: 700;
	color: #64748b;
	text-transform: uppercase;
	letter-spacing: 1px;
}

.logo-container {
	width: 65px;
	height: 65px;
	background-color: #e8f5e9;
	border: 2px solid #157347;
}

.logo-container i {
	font-size: 2.8rem !important;
	color: #157347;
}

/* SECCIONES SIMÉTRICAS CON SEPARACIÓN AUMENTADA (+4MM) */
.custom-section-box {
	border-radius: 10px;
	padding: 10px 20px;
	border: 1px solid #e2e8f0;
}

/* Box 1 a Box 2: +4mm */
.section-profesional {
	background-color: #f0f7ff;
	border-left: 6px solid #0d6efd;
	border-color: #cfe2ff;
	padding: 15px 20px !important;
	min-height: 90px;
	display: flex;
	align-items: center;
	margin-bottom: 16px !important; /* Aumentado para la separación */
}

/* Box 2 a Tablas: +4mm */
.section-config {
	background-color: #fff8f2;
	border-left: 6px solid #fd7e14;
	border-color: #ffe8cc;
	padding: 12px 20px !important;
}

.section-periodo {
	background-color: #f8fafc;
	border-left: 6px solid #64748b;
	border-color: #e2e8f0;
	padding: 12px 20px !important;
}

.row-central-margin {
	margin-bottom: 18px !important;
} /* Espacio extra hacia las tablas */
.box-label {
	font-size: 0.65rem;
	font-weight: 800;
	color: #64748b;
	text-transform: uppercase;
	letter-spacing: 0.5px;
	margin-bottom: 4px;
	margin-left: 5px;
	display: block;
}

/* FOTO MÉDICO */
.doctor-photo-frame {
	width: 60px;
	height: 60px;
	border-radius: 8px;
	border: 2px solid #fff;
	box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
	overflow: hidden;
	background-color: #edf2f7;
	display: flex;
	align-items: center;
	justify-content: center;
}

/* TABLAS */
.table-scroll-fixed {
	height: 35vh;
	overflow-y: auto;
	border: 1px solid #cbd5e1;
	border-radius: 8px;
	background: white;
}

.header-table-dark {
	position: sticky;
	top: 0;
	z-index: 10;
	background-color: #212529 !important;
	color: white !important;
	font-weight: 800;
	font-size: 0.7rem;
	text-transform: uppercase;
	padding: 10px 10px !important;
	border: none;
}

.bg-tabla-libres {
	background-color: #1b4332 !important;
}

.bg-tabla-ocupados {
	background-color: #1e3a8a !important;
}

.bg-tabla-sobreturnos {
	background-color: #856404 !important;
}

/* SIGAT: FIX RELOJ - ANCHO COMPLETO */
#fechaHora {
	border: none !important;
	background: transparent !important;
	font-weight: 800;
	outline: none;
	/* Subimos a 260px para asegurar que entren los segundos y respiren */
	width: 270px !important;
	color: #157347;
	font-size: 1rem;
	text-align: right;
	font-family: 'Consolas', 'Monaco', 'Courier New', monospace !important;
	padding-right: 10px !important;
	margin: 0 !important;
}

/* Asegúrate que el contenedor padre tenga espacio de sobra */
.d-flex.align-items-center.bg-white.border.rounded-pill {
	min-width: 300px !important;
	justify-content: flex-end;
	padding-right: 15px;
}

.form-control, .form-select {
	height: 34px !important;
	font-size: 0.9rem !important;
	padding: 2px 8px !important;
}

.btn-ejecutar {
	background-color: #157347 !important;
	color: white !important;
	font-weight: 700;
	height: 42px !important;
}

.btn-buscar {
	background-color: #6c757d !important;
	color: white !important;
	font-weight: 700;
	height: 42px !important;
}

.gx-minima {
	--bs-gutter-x: 1rem;
}
</style>

<body class="bg-light">
	<header th:replace="~{layout/layout :: header}"></header>

	<div class="viewport-container">
		<div class="container-custom-width">
			<div class="card card-full shadow">
				<div class="card-body p-2 px-4">

					<!-- ENCABEZADO -->
					<div class="header-clinica">
						<div class="d-flex align-items-center">
							<div
								class="d-flex align-items-center justify-content-center rounded-3 me-3 logo-container shadow-sm">
								<i class="bi bi-calendar-x-fill"></i>
							</div>
							<div>
								<h2 th:text="${titulo}" class="mb-0 titulo-grande"></h2>
								<p class="subtitulo-sigat mb-0">SIGAT • Gestión Integral de
									Cancelaciones</p>
							</div>
						</div>
						<div
							class="d-flex align-items-center bg-white border px-4 py-2 rounded-pill shadow-sm"
							style="height: 40px;">
							<i class="bi bi-clock-fill text-success me-2"
								style="font-size: 1.1rem;"></i> <input type="text"
								id="fechaHora" name="fechaHora" readonly>
						</div>
					</div>

					<form id="myFormCancelarPlanilla">
						<input type="checkbox" id="isCheckProfEsp" style="display: none;">

						<!-- SECCIÓN 1: PROFESIONAL (Con margen inferior aumentado) -->
						<div class="custom-section-box section-profesional shadow-sm">
							<div class="row w-100 g-2 align-items-center">
								<div class="col-auto">
									<div class="doctor-photo-frame">
										<img id="fotoMedico" src="" style="display: none;">
										<div id="defaultAvatar" class="text-center text-muted">
											<i class="fa-solid fa-user-doctor fa-2x"></i>
										</div>
									</div>
								</div>
								<div class="col">
									<div class="row gx-minima">
										<div class="col-md-6">
											<span class="box-label">Profesional | Médico</span>
											<div class="input-group"
												style="border: 1px solid #ced4da; border-radius: 4px; overflow: hidden; background: white;">
												<!-- Buscador Camuflado -->
												<input type="text" id="profesionalInput"
													class="form-control border-0 shadow-none"
													list="profesionalesList"
													placeholder="Escriba para buscar..."
													style="font-size: 14px; height: 35px;"
													autocomplete="new-password" role="presentation"
													spellcheck="false"
													onclick="limpiarBuscadorProfesional(this)"
													oninput="sincronizarProfesional(this)">

												<datalist id="profesionalesList">
													<option th:each="p : ${profesionales}"
														th:value="${p.codigo} + ' - ' + ${p.apellido} + ' ' + ${p.nombre}"
														th:data-id="${p.id}"></option>
												</datalist>

												<!-- Select original OCULTO (Mantiene ID y Name para tu controlador) -->
												<select id="profesional" name="profesional" class="d-none">
													<option value="" disabled selected>Seleccione
														Profesional...</option>
													<option th:each="p : ${profesionales}" th:value="${p.id}"
														th:text="${p.codigo} + ' - ' + ${p.apellido} + ' ' + ${p.nombre}"></option>
												</select>
											</div>
										</div>

										<div class="col-md-6">
											<span class="box-label">Especialidad Vinculada</span> <select
												id="especialidad" name="especialidad" class="form-select"
												onclick="existeEspecialidad()"
												onchange="focusTipoCancelacion();">
												<option value="" disabled selected>Seleccione
													Especialidad...</option>
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>

						<!-- SECCIONES 2 Y 3 (Con margen inferior aumentado hacia las tablas) -->
						<div class="row gx-minima row-central-margin">
							<div class="col-lg-5">
								<div class="custom-section-box section-config shadow-sm h-100">
									<span class="box-label"><i
										class="fa-solid fa-gears me-1"></i> Configuración</span>
									<div class="row g-2">
										<div class="col-6">
											<select class="form-select" id="tipoCancelacion"
												name="tipoCancelacion" onchange="deshabilitarElementos()">
												<option value="" disabled selected>Modalidad...</option>
												<option value="PorFecha">Por Fecha</option>
												<option value="PorFechaHora">Por Fecha y Horario</option>
											</select>
										</div>
										<div class="col-6">
											<select id="motivoCancelacion" name="motivoCancelacion"
												class="form-select" onchange="focusFechaInicio();">
												<option value="" disabled selected>Motivo...</option>
												<option value="Trafico Intenso">Tráfico</option>
												<option value="Congreso">Congreso</option>
												<option value="Enfermedad">Enfermedad</option>
												<option value="Cirugia">Cirugía</option>
												<option value="Otro Motivo">Otro</option>
											</select>
										</div>
									</div>
								</div>
							</div>
							<div class="col-lg-7">
								<div class="custom-section-box section-periodo shadow-sm h-100">
									<span class="box-label"><i
										class="fa-solid fa-calendar-days me-1"></i> Rango de
										Aplicación</span>
									<div class="row gx-2">
										<div class="col-md-6 border-end pe-3">
											<div class="d-flex gap-2">
												<input type="date" class="form-control" id="fechaInicial">
												<input type="time" class="form-control" id="horaInicio"
													style="width: 110px;">
											</div>
										</div>
										<div class="col-md-6 ps-3">
											<div class="d-flex gap-2">
												<input type="date" class="form-control" id="fechaFin">
												<input type="time" class="form-control" id="horaFinal"
													style="width: 110px;">
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>

						<!-- TABLAS DE RESULTADOS -->
						<div class="row gx-minima">
							<div class="col-md-4">
								<div class="table-scroll-fixed shadow-sm">
									<table class="table table-sm table-hover mb-0"
										id="tablaTurnosLibres">
										<thead>
											<tr>
												<th class="header-table-dark bg-tabla-libres text-center">Turnos
													Libres</th>
											</tr>
										</thead>
										<tbody></tbody>
									</table>
								</div>
							</div>
							<div class="col-md-4">
								<div class="table-scroll-fixed shadow-sm">
									<table class="table table-sm table-hover mb-0"
										id="tablaTurnosOcupados">
										<thead>
											<tr>
												<th class="header-table-dark bg-tabla-ocupados text-center">Turnos
													Ocupados</th>
											</tr>
										</thead>
										<tbody></tbody>
									</table>
								</div>
							</div>
							<div class="col-md-4">
								<div class="table-scroll-fixed shadow-sm">
									<table class="table table-sm table-hover mb-0"
										id="tablaSobreturnosOcupados">
										<thead>
											<tr>
												<th
													class="header-table-dark bg-tabla-sobreturnos text-center">Sobreturnos
													Ocupados</th>
											</tr>
										</thead>
										<tbody></tbody>
									</table>
								</div>
							</div>
						</div>

						<div class="d-flex gap-3 mt-3">
							<!-- BUSCAR: Acción segura -->
							<button type="button" id="btnBuscarDatos" class="flex-grow-1"
								onclick="buscarDatos()">
								<i class="fa-solid fa-magnifying-glass me-2"></i> BUSCAR
								RESULTADOS
							</button>

							<!-- EJECUTAR: Acción crítica -->
							<button type="button" id="btnCancelarTurnos" class="flex-grow-1"
								onclick="ejecutarCancelacionMedicaMasiva()">
								<i class="fa-solid fa-ban me-2"></i> EJECUTAR CANCELACIÓN
							</button>
						</div>

					</form>
				</div>
			</div>
		</div>
	</div>

	<footer th:replace="~{layout/layout :: footer}"></footer>

	<script
		th:replace="planillas/js/load-combobox-vinculacion-cancelar-turnos :: javascript"></script>
	<script
		th:replace="planillas/js/funcionesParaCancelarPlanillas :: javascript"></script>
	<script
		th:replace="planillas/js/funcionesParaBajaMedicaElite :: javascript"></script>

	<script th:inline="javascript">
		const imgEl = document.getElementById('fotoMedico');
		const fallback = document.getElementById('defaultAvatar');
		imgEl.onerror = function() {
			this.style.display = 'none';
			fallback.style.display = 'block';
		};
		
		function sincronizarProfesional(input) {
		    const val = input.value;
		    const options = document.querySelectorAll('#profesionalesList option');
		    const realSelect = document.getElementById('profesional');
		    
		    for (let opt of options) {
		        if (opt.value === val) {
		            realSelect.value = opt.getAttribute('data-id');
		            // Notificamos el cambio para que tu lógica actual dispare las especialidades
		            realSelect.dispatchEvent(new Event('change'));
		            
		            if (typeof cargarEspecialidades === "function") {
		                cargarEspecialidades();
		            }
		            input.blur();
		            break;
		        }
		    }
		}

		function limpiarBuscadorProfesional(input) {
		    input.value = '';
		    const realSelect = document.getElementById('profesional');
		    if (realSelect) {
		        realSelect.value = "";
		        realSelect.dispatchEvent(new Event('change'));
		    }
		    // Limpia la especialidad vinculada
		    const especSelect = document.getElementById('especialidad');
		    if (especSelect) especSelect.innerHTML = '<option value="" disabled selected>Seleccione Especialidad...</option>';
		}
	</script>
</body>
</html>
