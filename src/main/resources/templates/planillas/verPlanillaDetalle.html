<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head}">
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cloudflare.com">
</head>
<style>
/* Estética SIGAT: Centrado vertical y balance de pantalla */
.viewport-container {
	min-height: calc(100vh - 110px);
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 1rem 0;
}

.header-clinica {
	border-bottom: 2px solid #dee2e6;
	position: relative;
	padding-bottom: 12px;
	margin-bottom: 15px;
}

.header-clinica::after {
	content: "";
	position: absolute;
	bottom: -2px;
	left: 0;
	width: 100px;
	height: 4px;
	background-color: #0d6efd;
	border-radius: 2px;
}

/* Bloques de información del profesional */
.info-box {
	background-color: #f8fafc;
	border-radius: 10px;
	padding: 12px 18px;
	border: 1px solid #e2e8f0;
	height: 100%;
}

.info-label {
	font-size: 0.7rem;
	text-transform: uppercase;
	color: #64748b;
	font-weight: 800;
	margin-bottom: 2px;
	display: flex;
	align-items: center;
}

.info-label i {
	margin-right: 6px;
	color: #0d6efd;
}

.awesome {
	margin-right: 6px;
}

.info-value {
	font-size: 1rem;
	color: #1e293b;
	font-weight: 700;
}

/* Tabla de turnos con scroll y cabecera fija */
.table-container-fixed {
	height: 275px;
	overflow-y: auto;
	border: 1px solid #dee2e6;
	border-radius: 8px;
	background: white;
}

.table thead th {
	position: sticky;
	top: 0;
	background-color: #f1f5f9;
	font-size: 0.75rem;
	color: #475569;
	font-weight: 800;
	text-transform: uppercase;
	z-index: 10;
	border-bottom: 2px solid #dee2e6;
}

.badge-status {
	font-size: 0.7rem;
	padding: 0.4em 0.8em;
	border-radius: 50px;
	font-weight: 700;
}

/* Reglas para Impresión PDF */
@media print {
	@page {
		size: auto;
		margin: 15mm;
	}
	header, footer, .btn-acciones {
		display: none !important;
	}
	.card {
		border: none !important;
		box-shadow: none !important;
	}
	.viewport-container {
		min-height: auto !important;
		padding: 0 !important;
		display: block !important;
	}
	.table-container-fixed {
		height: auto !important;
		overflow: visible !important;
	}
}
</style>
<body class="bg-light">

	<header th:replace="~{layout/layout :: header}"></header>

	<div class="container viewport-container">
		<div class="row justify-content-center w-100 m-0">
			<div class="col-12 col-xl-10">

				<div class="card shadow-lg border-0 rounded-3">
					<div class="card-body p-4 p-md-5">

						<!-- ENCABEZADO -->
						<div class="header-clinica d-flex align-items-center">
							<i class="fa-solid fa-clock fa-2x text-primary me-3"></i>
							<div>
								<h3 th:text="${titulo}" class="fw-bold text-dark mb-0"></h3>
								<p class="text-muted mb-0 small text-uppercase">SIGAT •
									Detalle de Planillas y Disponibilidad</p>
							</div>
						</div>

						<!-- DATOS DEL PROFESIONAL (Se asume un solo objeto en la lista para la cabecera) -->
						<div class="row g-3 mb-4"
							th:if="${not #lists.isEmpty(planillaDetCompleta)}">
							<div class="col-md-6 col-lg-3">
								<div class="info-box shadow-sm">
									<div class="info-label">
										<i class="awesome fa-solid fa-user-doctor"></i>Médico
									</div>
									<div class="info-value"
										th:text="${planillaDetCompleta[0].planillacabecera.profesional.apellido} + ' ' + ${planillaDetCompleta[0].planillacabecera.profesional.nombre}"></div>
								</div>
							</div>
							<div class="col-md-6 col-lg-3">
								<div class="info-box shadow-sm">
									<div class="info-label">
										<i class="awesome fa-solid fa-hashtag"></i>Código Prof.
									</div>
									<div class="info-value text-primary"
										th:text="${planillaDetCompleta[0].planillacabecera.profesional.codigo}"></div>
								</div>
							</div>
							<div class="col-md-6 col-lg-3">
								<div class="info-box shadow-sm">
									<div class="info-label">
										<i class="awesome fa-solid fa-stethoscope"></i>Especialidad
									</div>
									<div class="info-value"
										th:text="${planillaDetCompleta[0].planillacabecera.especialidad.especialidadNombre}"></div>
								</div>
							</div>
							<div class="col-md-6 col-lg-3">
								<div class="info-box shadow-sm">
									<div class="info-label">
										<i class="awesome fa-solid fa-id-badge"></i>Cód. Esp.
									</div>
									<div class="info-value text-primary"
										th:text="${planillaDetCompleta[0].planillacabecera.especialidad.especialidadCodigo}"></div>
								</div>
							</div>
						</div>

						<!-- TABLA DE RANGO HORARIO -->
						<h6 class="text-danger fw-bold mb-2">
							<i class="fa-solid fa-list-check me-2"></i>RANGO HORARIO OBTENIDO
						</h6>
						<div class="table-container-fixed shadow-sm">
							<table class="table table-hover align-middle mb-0"
								id="rangoMysql">
								<thead>
									<tr>
										<th>Día Atención</th>
										<th>Rango Fecha y Hora</th>
										<th class="text-center">Estado [Turno]</th>
										<th>Observaciones</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="plaDet : ${planilladetalle}">
										<td class="fw-bold text-secondary"
											th:text="${#dates.format(plaDet.rangoFechaHora, 'EEEE').toUpperCase()}"></td>
										<td
											th:text="${#dates.format(plaDet.rangoFechaHora, 'dd/MM/yyyy HH:mm')}"></td>
										<td class="text-center"><span class="badge badge-status"
											th:classappend="${plaDet.Estado.nombre == 'Libre' ? 'bg-success' : 'bg-warning text-dark'}"
											th:text="${plaDet.Estado.nombre}"></span></td>
										<td class="small text-muted" th:text="${plaDet.Observacion}"></td>
									</tr>
								</tbody>
							</table>
						</div>

						<!-- ACCIONES -->
						<div
							class="mt-4 pt-3 d-flex flex-column flex-md-row gap-3 btn-acciones">
							<button onclick="window.print();"
								class="btn btn-primary btn-lg flex-grow-1 fw-bold shadow">
								<i class="fa-solid fa-print me-2"></i>IMPRIMIR PLANILLA
							</button>
							<a th:href="@{/planillacabecera/listarPlanillaCabecera}"
								class="btn btn-outline-secondary btn-lg flex-grow-1 fw-bold px-4">
								<i class="fa-solid fa-arrow-left me-2"></i>VOLVER AL LISTADO
							</a>

						</div>

					</div>
				</div>
			</div>
		</div>
	</div>

	<footer th:replace="~{layout/layout :: footer}"></footer>
</body>
</html>
