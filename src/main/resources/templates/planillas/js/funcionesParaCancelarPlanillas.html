		//Convertimos a español los dias de la semana de moment.
		function ObtenerDiaEspañol(date) {
			const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
			return days[moment(date).day()];
		}

		//Buscamos turnos libres, turnos ocupados y sobreturnos para luego Cancelarlos.
		function buscarDatos() {
			// 1. Obtener los elementos por su ID
			const checkProfEsp = document.getElementById('isCheckProfEsp');
			const comboMotivo = document.getElementById('motivoCancelacion');
			if (checkProfEsp.checked && comboMotivo.selectedIndex !== 0) {
				//alert("llego a buscar");
				const combo = document.getElementById("tipoCancelacion");

				if (combo.selectedIndex === 1) {
					//LIMPIAR TABLAS 
					clearTableCompleta('tablaTurnosLibres');
					clearTableCompleta('tablaTurnosOcupados');
					clearTableCompleta('tablaSobreturnosOcupados');
					//Buscar Turnos Libres por Fecha
					buscarTurnosLibresFechas();
					//Buscar Turnos Ocupados por Fecha
					buscarTurnosOcupadosFechas();
					//Buscar Sobreturnos por Fecha
					buscarSobreturnosOcupadosFechas();

				} else if (combo.selectedIndex === 2) {
					//LIMPIAR TABLAS 
					clearTableCompleta('tablaTurnosLibres');
					clearTableCompleta('tablaTurnosOcupados');
					clearTableCompleta('tablaSobreturnosOcupados');
					//Buscar Turnos Libres por Fecha y Hora
					buscarTurnosLibresFechasHoras();
					//Buscar Turnos Ocupados por Fecha y Hora
					buscarTurnosOcupadosFechasHoras();
					//Buscar Sobreturnos por Fecha y Hora
					buscarSobreturnosOcupadosFechasHoras();
				} else {
					//console.log("Otro índice seleccionado");
				}
			}
			else {
				// 3. Mostrar mensaje de error con SweetAlert2
				Swal.fire({
					title: '¡Error de validación!',
					text: 'Debe completar todos los campos.. Verifique !',
					icon: 'error',
					confirmButtonText: 'Aceptar'
				});
			}
		}

		async function cancelarTurnos() {
			const combo = document.getElementById("tipoCancelacion");

			if (combo.selectedIndex === 0) {
				// Notificación de error en lugar de alert
				mostrarNotificacionBackupDB("Seleccione una opción válida", "error");
				return;
			}

			// Confirmación inicial con botones anchos e iguales
			const {isConfirmed} = await Swal.fire({
			    title: 'Sigat',
			    html: "¿Está seguro de proceder con la cancelación?<br>Se realizará un backup primero.",
			    icon: 'warning',
			    showCancelButton: true,
			    confirmButtonColor: '#2c3e50', // Azul
			    cancelButtonColor: '#6c757d',  // Gris
			    confirmButtonText: 'Sí',
			    cancelButtonText: 'No',
			    //reverseButtons: true, // Mueve el "Sí" a la derecha
			    focusConfirm: true,     // Resalta el "Sí"
			    didOpen: () => {
			        // Accedemos a los botones y les damos el mismo ancho fijo
			        const confirmBtn = Swal.getConfirmButton();
			        const cancelBtn = Swal.getCancelButton();
			        confirmBtn.style.width = '120px';
			        cancelBtn.style.width = '120px';
			    }
			});

			if (!isConfirmed) {
				return; // Detiene la ejecución si el usuario cancela
			}

			try {
				console.log("Llamando al servidor para backup...");
				//mostrarNotificacionBackupDB("Iniciando backup de seguridad...", "success");

				const response = await fetch('/api/db/backup', {
					method: 'GET',
					headers: {
						'Accept': 'application/json',
						'Content-Type': 'application/json'
					}
				});

				if (!response.ok) {
					const errorData = await response.json();
					throw new Error(errorData.message || "Error en el servidor");
				}

				const result = await response.json();

				if (result.status === "success") {
					console.log("Backup OK. Procediendo...");
					// Notificación de éxito
					mostrarNotificacionBackupDB("Backup finalizado con éxito.", "success");

					if (combo.selectedIndex === 1) {
						verificarTablasFechas();
					} else if (combo.selectedIndex === 2) {
						verificarTablasFechasHoras();
					}
				}

			} catch (error) {
				console.error("Detalle del fallo:", error);
				// Notificación de error en lugar de alert
				mostrarNotificacionBackupDB("Error de sistema: " + error.message, "error");
			}
		}

		// Función auxiliar para crear el aviso visual (Toast)
		function mostrarNotificacionBackupDB(mensaje, tipo) {
			const toast = document.createElement("div");
			toast.className = `toast-notification ${tipo === 'success' ? 'toast-success' : 'toast-error'}`;
			toast.innerText = mensaje;

			document.body.appendChild(toast);

			// Animación de salida y borrado
			setTimeout(() => {
				toast.style.opacity = "0";
				setTimeout(() => toast.remove(), 500);
			}, 3500);
		}

		function verificarTablasFechas() {
		    // Referencias a las tablas
		    const tabla1 = document.getElementById('tablaTurnosLibres');
		    const tabla2 = document.getElementById('tablaTurnosOcupados');
		    const tabla3 = document.getElementById('tablaSobreturnosOcupados');

		    // Verificamos si las tres están vacías (fila <= 1)
		    const t1Vacia = !tabla1 || tabla1.rows.length <= 1;
		    const t2Vacia = !tabla2 || tabla2.rows.length <= 1;
		    const t3Vacia = !tabla3 || tabla3.rows.length <= 1;

		    if (t1Vacia && t2Vacia && t3Vacia) {
				Swal.fire({
				            title: '<span style="font-family: Arial; font-size: 18px; font-weight: bold;">Sin turnos para procesar</span>',
				            html: 'No se encontraron datos para cancelar. Verifique..',
				            icon: 'info',
				            confirmButtonText: 'ENTENDIDO',
				            confirmButtonColor: '#3085d6',
				            didOpen: () => {
				                const confirmBtn = Swal.getConfirmButton();
				                confirmBtn.style.width = '150px';
				            }
				        });
				        return; // Detiene la ejecución
		    }

		    Swal.fire({
		        title: '<span style="font-family: Arial; font-size: 20px;">Deseas cancelar las planillas seleccionadas?</span>',
		        html: '¡Verifique los datos por favor!<br>',
		        icon: 'warning',
		        showCancelButton: true,
		        confirmButtonColor: '#3085d6', // Color para el SÍ
		        cancelButtonColor: '#d33',    // Color para el NO
		        confirmButtonText: 'SI',
		        cancelButtonText: 'NO',
		        reverseButtons: false, // SÍ a la izquierda, NO a la derecha
		        didOpen: () => {
		            // Esto iguala el ancho de ambos botones al abrirlos
		            const confirmBtn = Swal.getConfirmButton();
		            const cancelBtn = Swal.getCancelButton();
		            confirmBtn.style.width = '120px';
		            cancelBtn.style.width = '120px';
		        }
		    }).then((result) => {
		        if (result.isConfirmed) {
		            // 1. Verificar Tabla 1 tiene mas de una fila - (Cabecera = fila 0)
		            if (tabla1 && tabla1.rows.length > 1) {

		                //cancelar Turnos Libres por Fecha (Update)
		                actualizarPlaDetCanceladoFechasTL();
		            }

		            // 2. Verificar Tabla 2 tiene mas de una fila - (Cabecera = fila 0)
		            if (tabla2 && tabla2.rows.length > 1) {

		                //Guardar pdf en carpeta local (PlanillasCanceladasPdf)	
		                backupTurnosOcupadosFechas_Pdf();

		                /* A) Desactivar safe Update al eliminar por fechas y no por Id de MySql (SET)
		                   B) Eliminar Turnos Ocupados por Fecha (delete)
		                   C) Cancelar Turnos Ocupados por Fecha (Update) */
		                ejecutarFlujoCancelacionTurnosFechas();

		            }

		            // 3. Verificar Tabla 3 tiene mas de una fila - (Cabecera = fila 0)
		            if (tabla3 && tabla3.rows.length > 1) {

		                //Guardar pdf en carpeta local (PlanillasCanceladasPdf)
		                backupSobreturnosOcupadosFechas_Pdf();
		                //Desactivar safe Update de MySql (SET)
		                desactivarSafeUpdates();
		                //Eliminar Sobreturnos por Fecha (delete)
		                eliminarSobreturnosOcupadosFechas();

		            }
		        } else if (result.dismiss === Swal.DismissReason.cancel) {
		            //Swal.fire('Cancelado', 'El registro está seguro', 'error');
		        }
		    });
		}

				didOpen: () => {
					// Esto iguala el ancho de ambos botones al abrirlos
					const confirmBtn = Swal.getConfirmButton();
					const cancelBtn = Swal.getCancelButton();
					confirmBtn.style.width = '120px';
					cancelBtn.style.width = '120px';
				}
			}).then((result) => {
				if (result.isConfirmed) {
					// Obtenemos las referencias a las 3 tablas por su ID
					const tabla1 = document.getElementById('tablaTurnosLibres');
					const tabla2 = document.getElementById('tablaTurnosOcupados');
					const tabla3 = document.getElementById('tablaSobreturnosOcupados');

					// 1. Verificar Tabla 1 tiene mas de una fila - (Cabecera = fila 0)
					if (tabla1 && tabla1.rows.length > 1) {
						//alert("La Tabla 1 tiene datos.");
						//cancelar Turnos Libres por Fecha y Hora (Update)
						actualizarPlaDetCanceladoFechasHorasTL();

					}

					// 2. Verificar Tabla 2 tiene mas de una fila - (Cabecera = fila 0)
					if (tabla2 && tabla2.rows.length > 1) {
						//alert("La Tabla 2 tiene datos.");
						//Guardar pdf en carpeta local (PlanillasCanceladasPdf)
						backupTurnosOcupadosFechasHoras_Pdf();
						/* A) Desactivar safe Update al eliminar por fechas Horas y no por Id de MySql (SET)
						   B) Eliminar Turnos Ocupados por Fecha Hora (delete)
						   C) Cancelar Turnos Ocupados por Fecha Hora (Update) */
						ejecutarFlujoCancelacionTurnosFechasHoras();

					}

					// 3. Verificar Tabla 3 tiene mas de una fila - (Cabecera = fila 0)
					if (tabla3 && tabla3.rows.length > 1) {
						//alert("La Tabla 3 tiene datos.");

						//Guardar pdf en carpeta local (PlanillasCanceladasPdf)
						backupSobreturnosOcupadosFechasHoras_Pdf();
						//Desactivar safe Update de MySql (SET)
						desactivarSafeUpdates();
						//Eliminar Sobreturnos por Fecha y Hora (delete)
						eliminarSobreturnosOcupadosFechasHoras();
					}
				} else if (result.dismiss === Swal.DismissReason.cancel) {
					//Swal.fire('Cancelado', 'El registro está seguro', 'error');
				}
			});

		}

		function actualizarEncabezado(titulos, idTabla) {
			const tabla = document.getElementById(idTabla);

			// 1. Eliminar encabezado existente (thead)
			let thead = tabla.querySelector("thead");
			if (thead) {
				thead.remove(); // O thead.innerHTML = "";
			}

			// 2. Crear nuevo thead
			thead = tabla.createTHead();
			// 3. Agregar clase table-secondary al thead
			thead.className = 'table-secondary';
			const fila = thead.insertRow();

			// 3. Crear celdas th dinámicamente
			titulos.forEach(titulo => {
				const th = document.createElement("th");
				th.textContent = titulo;
				fila.appendChild(th);
			});
		}


		function clearTableTr(idTabla) {
			// Obtén la referencia a la tabla por su ID
			const tabla = document.getElementById(idTabla);
			// Esto conservará el encabezado si está en <thead>			
			const filas = tabla.getElementsByTagName('tr');
			for (let i = filas.length - 1; i > 0; i--) { // Itera hacia atrás para no afectar el índice
				filas[i].remove();
			}

			// Para borrar todas las filas, incluyendo el encabezado:
			//tabla.querySelectorAll('tr').forEach(tr => tr.remove());
		}

		function clearTableCompleta(idTabla) {
			const tabla = document.getElementById(idTabla);
			const filas = tabla.getElementsByTagName('tr');

			// Cambiamos "i > 0" por "i >= 0" para incluir la primera fila (encabezado)
			for (let i = filas.length - 1; i >= 0; i--) {
				filas[i].remove();
			}
		}

		//FUNCION PARA Fecha y Hora
		function actualizarFechaHora() {
			const fechaHoraActual = new Date();
			const opciones = {
				weekday: 'long',
				timeZone: 'America/Argentina/Buenos_Aires'
			};
			const diaSemana = fechaHoraActual.toLocaleDateString('es-AR',
				opciones);
			const fechaHoraFormateada = diaSemana.toUpperCase() + ' '
				+ fechaHoraActual.toLocaleString();
			document.getElementById("fechaHora").value = fechaHoraFormateada;
		}

		// Actualizar la fecha y hora cada segundo (FECHA Y HORA)
		try {
			setInterval(actualizarFechaHora, 1000);
		} catch (error) {
			console.error("Se produjo un error en setInterval(actualizarFechaHora, 1000):", error);
		}

		// Inicializar la fecha y hora al cargar la página (FECHA Y HORA)
		try {
			actualizarFechaHora();
		} catch (error) {
