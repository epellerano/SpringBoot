<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head th:replace="~{layout/layout :: head}"></head>
<style>
/* SIGAT: MEDICAL ELITE - REPORTES ESTRUCTURA FINAL */
.viewport-container {
	min-height: calc(100vh - 70px);
	display: flex;
	flex-direction: column;
	align-items: center;
	padding: 15px 0 10px 0;
}

.container-custom-width {
	max-width: 98%;
	width: 98%;
	margin: 0 auto;
}

.card-full {
	width: 100%;
	border-radius: 12px;
	border: 1px solid #e2e8f0;
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08) !important;
}

.header-clinica {
	border-bottom: 2px solid #dee2e6;
	padding-bottom: 8px;
	margin-bottom: 12px;
	display: flex;
	align-items: center;
	justify-content: space-between;
}

.titulo-grande {
	font-size: 1.6rem !important;
	font-weight: 700;
	color: #164e63;
	margin: 0;
}

.subtitulo-sigat {
	font-size: 0.65rem !important;
	font-weight: 700;
	color: #64748b;
	text-transform: uppercase;
	letter-spacing: 1px;
}

.custom-section-box {
	border-radius: 10px;
	padding: 12px 20px;
	margin-bottom: 10px;
	border: 1px solid #e2e8f0;
}

.section-azul {
	background-color: #f0f7ff;
	border-left: 6px solid #0d6efd;
}

.section-lila {
	background-color: #f5f3ff;
	border-left: 6px solid #7c3aed;
}

.box-label {
	font-size: 0.65rem;
	font-weight: 800;
	color: #475569;
	text-transform: uppercase;
	margin-bottom: 3px;
	display: block;
}

.reporte-selector {
	display: flex;
	justify-content: space-between;
	gap: 5px;
	width: 100%;
}

.reporte-selector input[type="radio"] {
	display: none;
}

.reporte-selector label {
	flex: 1;
	text-align: center;
	padding: 7px 2px;
	background-color: white;
	border: 1px solid #ddd6fe;
	color: #6b21a8;
	border-radius: 6px;
	font-weight: 700;
	font-size: 0.72rem;
	cursor: pointer;
	text-transform: uppercase;
}

.reporte-selector input[type="radio"]:checked+label {
	background-color: #7c3aed;
	color: white;
}

/* CSS CLAVE PARA QUE SE VEA LA TABLA */
.table-responsive-custom {
	height: 32vh;
	overflow-y: auto;
	border: 1px solid #cbd5e1;
	border-radius: 8px;
	background: white;
	margin-bottom: 12px;
}

#tablaReportes thead th {
	background-color: #1b4332 !important;
	color: white !important;
	position: sticky;
	top: 0;
	z-index: 10;
	font-size: 0.8rem;
	text-transform: uppercase;
}

#tablaReportes tbody tr td {
	vertical-align: middle;
	font-size: 0.85rem;
	color: #334155;
}

#fechaHora {
	border: none !important;
	background: transparent !important;
	font-weight: 800;
	color: #164e63;
	text-align: right;
	width: 300px;
}
</style>

<body class="bg-light">
	<header th:replace="~{layout/layout :: header}"></header>
	<div class="viewport-container">
		<div class="container-custom-width">
			<div class="card card-full shadow">
				<div class="card-body p-3 px-4">
					<!-- ENCABEZADO -->
					<div class="header-clinica">
						<div class="d-flex align-items-center">
							<div
								class="d-flex align-items-center justify-content-center rounded-3 me-3"
								style="width: 48px; height: 48px; background-color: #e2e8f0; border: 1px solid #164e63;">
								<i class="bi bi-file-earmark-medical-fill"
									style="font-size: 1.8rem; color: #164e63;"></i>
							</div>
							<div>
								<h3 th:text="${titulo}" class="mb-0 titulo-grande"></h3>
								<p class="subtitulo-sigat mb-0">SIGAT • Gestión de listados</p>
							</div>
						</div>
						<div
							class="d-flex align-items-center bg-white border px-3 py-1 rounded-pill shadow-sm">
							<i class="bi bi-clock-fill text-info me-2"></i> <input
								type="text" id="fechaHora" readonly>
						</div>
					</div>

					<form id="myForm" th:action="@{/reportes/formReporte}"
						th:object="${turno}" method="post">
						<!-- BLOQUE 1: MÉDICO Y MODALIDAD -->
						<div class="custom-section-box section-azul shadow-sm">
							<div class="row align-items-end">
								<div class="col-md-7">
									<div class="row g-2">
										<div class="col-6">
											<span class="box-label">Médico / Profesional</span> <select
												class="form-select" id="profesional" name="profesional"
												th:onchange="cargarEspecialidades()">
												<option value="" disabled selected>Médico...</option>
												<option th:each="p : ${profesionales}" th:value="${p.id}"
													th:text="${p.codigo} + ' - ' + ${p.apellido} + ' ' + ${p.nombre}"></option>
											</select>
										</div>
										<div class="col-6">
											<span class="box-label">Especialidad Asociada</span> <select
												id="especialidad" name="especialidad" class="form-select"
												th:onclick="existeEspecialidad()">
												<option value="" disabled selected>Especialidad...</option>
											</select>
										</div>
									</div>
								</div>
								<div class="col-md-5 border-start ps-4">
									<span class="box-label">Modalidad de Reporte</span>
									<div class="d-flex gap-3">
										<label class="text-primary small fw-bold"><input
											type="checkbox" id="isCheckReporteFechas"
											th:onclick="uncheckOther(this)"> Por Fecha</label> <label
											class="text-primary small fw-bold"><input
											type="checkbox" id="isCheckReporteVigente"
											th:onclick="uncheckOther(this)"> Vigente</label> <label
											class="text-primary small fw-bold"><input
											type="checkbox" id="isCheckReporteHistorico"
											th:onclick="uncheckOther(this)"> Histórico</label>
									</div>
								</div>
							</div>
						</div>

						<!-- BLOQUE 2: FECHAS Y OBJETO -->
						<div class="custom-section-box section-lila shadow-sm">
							<div class="row mb-2">
								<div class="col-md-6">
									<span class="box-label">Fecha Desde:</span> <input type="date"
										class="form-control" id="fechaInicio" name="fechaInicio">
								</div>
								<div class="col-md-6">
									<span class="box-label">Fecha Hasta:</span> <input type="date"
										class="form-control" id="fechaFinal" name="fechaFinal">
								</div>
							</div>
							<div class="row mt-3">
								<div class="col-12">
									<span class="box-label">Seleccione Objeto a Reportar</span>
									<div class="reporte-selector">
										<input type="radio" name="reportes" id="r1"
											value="turnoCancelado"><label for="r1">Turnos
											Cancelados</label> <input type="radio" name="reportes" id="r2"
											value="sobreturnoCancelado"><label for="r2">Sobreturnos
											Cancelados</label> <input type="radio" name="reportes" id="r3"
											value="planillaCancelada"><label for="r3">Planillas
											Canceladas</label> <input type="radio" name="reportes" id="r5"
											value="movimiento"><label for="r5">Movimientos</label>
										<input type="radio" name="reportes" id="r7" value="turno"><label
											for="r7">Turnos</label> <input type="radio" name="reportes"
											id="r8" value="sobreturno"><label for="r8">Sobreturnos</label>
									</div>
								</div>
							</div>
						</div>

						<!-- TABLA RESULTADOS (ESTRUCTURA VIEJA COMPATIBLE) -->
						<div class="table-responsive-custom">
							<table class="table table-sm table-hover mb-0" id="tablaReportes">
								<thead>
									<!-- Dinámico por JS -->
								</thead>
								<tbody>
									<!-- Dinámico por JS -->
								</tbody>
							</table>
						</div>

						<!-- ACCIONES -->
						<div class="row g-2">
							<div class="col-6">
								<button type="button" class="btn btn-success w-100 fw-bold"
									style="height: 45px;" th:onclick="renderizarReporte()">PROCESAR
									DATOS</button>
							</div>
							<div class="col-6">
								<button type="button" class="btn btn-warning w-100 fw-bold"
									style="height: 45px;" id="btnImprimirPdf"
									th:onclick="imprimirReportePdf()" disabled>GENERAR PDF</button>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<footer th:replace="~{layout/layout :: footer}"></footer>
	<script
		th:replace="reportes/js/load-combobox-vinculacion-reportes :: javascript"></script>
	<script th:replace="reportes/js/funcionesParaReportes :: javascript"></script>

	<script>
		function actualizarFechaHora() {
			const fechaHoraActual = new Date();
			const opciones = {
				weekday : 'long',
				timeZone : 'America/Argentina/Buenos_Aires'
			};
			const diaSemana = fechaHoraActual.toLocaleDateString('es-AR',
					opciones);
			const el = document.getElementById("fechaHora");
			if (el)
				el.value = diaSemana.toUpperCase() + ' '
						+ fechaHoraActual.toLocaleString();
		}
		setInterval(actualizarFechaHora, 1000);
		actualizarFechaHora();

		//llenamos fechaFinal a partir de fechaInicio
		const f1 = document.getElementById('fechaInicio');
		const f2 = document.getElementById('fechaFinal');
		if (f1 && f2) {
			f1.addEventListener('input', function() {
				f2.value = this.value;
			});
		}
	</script>
</body>
</html>
