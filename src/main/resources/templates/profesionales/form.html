<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head th:replace="layout/layout :: head ">
<link rel="stylesheet" href="https://cloudflare.com">
</head>
<style>
/* AJUSTE DE ALTURA: 1 CM EXTRA */
.viewport-container {
	min-height: calc(100vh - 110px);
	display: flex;
	align-items: center;
	justify-content: center;
	padding-top: 0.5rem; /* Agregamos el cm extra aquí arriba */
	padding-bottom: 1rem;
}

.header-clinica {
	border-bottom: 2px solid #dee2e6;
	position: relative;
	padding-bottom: 12px; /* Un poco más de aire en el título */
	margin-bottom: 28px;
}

.header-clinica::after {
	content: "";
	position: absolute;
	bottom: -2px;
	left: 0;
	width: 100px;
	height: 4px;
	background-color: #198754;
	border-radius: 2px;
}

.border-dashed {
	border: 2px dashed #cbd5e0 !important;
	padding: 1.2rem !important; /* Respiro extra en zona de foto */
}

/* Inputs de tamaño balanceado */
.form-control {
	padding: 0.55rem 0.75rem;
	border: 1px solid #ced4da;
}

.input-group-text {
	background-color: #f8f9fa;
	border: 1px solid #ced4da;
	border-right: none;
}

.card {
	border-radius: 12px;
}
</style>
<body class="bg-light">

	<header th:replace="layout/layout :: header "></header>

	<div class="container viewport-container">
		<div class="row justify-content-center w-100 m-0">
			<div class="col-12 col-lg-11 col-xl-10">

				<div class="card shadow-lg border-0">
					<div class="card-body p-4 p-md-5">
						<!-- Recuperamos padding interno para elegancia -->

						<!-- TÍTULO STAFF MÉDICO EN VERDE PROFESIONAL -->
						<div class="header-clinica d-flex align-items-center">
							<!-- Contenedor con fondo verde menta muy suave -->
							<div
								class="d-flex align-items-center justify-content-center rounded-3 me-3"
								style="width: 70px; height: 70px; background-color: #e8f5e9;">

								<!-- Icono de Médico en verde bosque profesional -->
								<i class="bi bi-person-vcard-fill"
									style="font-size: 3rem; color: #2e7d32;"></i>
							</div>

							<div>
								<h3 th:text="${titulo}" class="fw-bold text-dark mb-0"></h3>
								<p class="text-muted mb-0 text-uppercase small"
									style="letter-spacing: 1px; font-size: 0.75rem; font-weight: 600;">
									SIGAT • Registro del Staff Medico</p>
							</div>
						</div>



						<form th:action="@{/form}" th:object="${profesional}"
							method="post" enctype="multipart/form-data" id="formProfesional">
							<div class="row g-3">
								<!-- g-3 mantiene todo a la vista -->

								<div class="col-md-6">
									<label class="form-label fw-bold small">Nombre</label>
									<div class="input-group">
										<span class="input-group-text"><i
											class="fa-solid fa-user"></i></span> <input type="text"
											style="text-transform: uppercase;" th:field="*{nombre}"
											class="form-control"
											th:errorclass="'form-control is-invalid'" />
									</div>
									<div class="invalid-feedback d-block"
										th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
								</div>

								<div class="col-md-6">
									<label class="form-label fw-bold small">Apellido</label>
									<div class="input-group">
										<span class="input-group-text"><i
											class="fa-solid fa-users"></i></span> <input type="text"
											style="text-transform: uppercase;" th:field="*{apellido}"
											class="form-control"
											th:errorclass="'form-control is-invalid'" />
									</div>
									<div class="invalid-feedback d-block"
										th:if="${#fields.hasErrors('apellido')}"
										th:errors="*{apellido}"></div>
								</div>

								<div class="col-md-6">
									<label class="form-label fw-bold small">Email
										Institucional</label>
									<div class="input-group">
										<span class="input-group-text"><i
											class="fa-solid fa-envelope"></i></span> <input type="email"
											th:field="*{email}" class="form-control"
											th:errorclass="'form-control is-invalid'" />
									</div>
									<div class="invalid-feedback d-block"
										th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
								</div>

								<div class="col-md-3 col-6">
									<label class="form-label fw-bold small">DNI</label>
									<div class="input-group">
										<span class="input-group-text"><i
											class="fa-solid fa-id-card"></i></span> <input type="text"
											th:field="*{dni}" class="form-control"
											th:errorclass="'form-control is-invalid'" />
									</div>
									<div class="invalid-feedback d-block"
										th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
								</div>

								<div class="col-md-3 col-6">
									<label class="form-label fw-bold small">Teléfono</label>
									<div class="input-group">
										<span class="input-group-text"><i
											class="fa-solid fa-phone"></i></span> <input type="text"
											th:field="*{telefono}" class="form-control"
											th:errorclass="'form-control is-invalid'" />
									</div>
									<div class="invalid-feedback d-block"
										th:if="${#fields.hasErrors('telefono')}"
										th:errors="*{telefono}"></div>
								</div>

								<div class="col-md-4">
									<label class="form-label fw-bold small">Código Interno</label>
									<div class="input-group">
										<span class="input-group-text"><i
											class="fa-solid fa-barcode"></i></span> <input type="hidden"
											name="codigoProfRollback" th:value="${profesional.codigo}" />
										<input type="text" style="text-transform: uppercase;"
											th:field="*{codigo}" class="form-control bg-light"
											th:errorclass="'form-control is-invalid'" />
									</div>
									<div class="invalid-feedback d-block"
										th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></div>
								</div>

								<div class="col-md-4">
									<label class="form-label fw-bold small">Matrícula</label>
									<div class="input-group">
										<span class="input-group-text"><i
											class="fa-solid fa-certificate"></i></span> <input type="text"
											th:field="*{matricula}" class="form-control"
											th:errorclass="'form-control is-invalid'" />
									</div>
									<div class="invalid-feedback d-block"
										th:if="${#fields.hasErrors('matricula')}"
										th:errors="*{matricula}"></div>
								</div>

								<div class="col-md-4">
									<label class="form-label fw-bold small">Fecha Nac</label>
									<div class="input-group">
										<span class="input-group-text"><i
											class="fa-solid fa-calendar-day"></i></span> <input type="date"
											th:field="*{createAt}" class="form-control"
											th:errorclass="'form-control is-invalid'" />
									</div>
									<div class="invalid-feedback d-block"
										th:if="${#fields.hasErrors('createAt')}"
										th:errors="*{createAt}"></div>
								</div>

								<!-- Foto -->
								<div class="col-12">
									<div class="card bg-light border-dashed">
										<div class="row align-items-center g-3">
											<div class="col-auto">
												<div id="preview-container"
													class="bg-white border rounded shadow-sm d-flex align-items-center justify-content-center"
													style="width: 85px; height: 85px; overflow: hidden;">
													<img id="img-preview"
														th:src="${profesional.foto != null && !#strings.isEmpty(profesional.foto)} ? @{/uploads/{path}(path=${profesional.foto})} : ''"
														th:class="${profesional.foto != null && !#strings.isEmpty(profesional.foto)} ? 'img-fluid' : 'img-fluid d-none'"
														style="object-fit: cover; width: 100%; height: 100%;">
													<i id="img-icon"
														th:class="${profesional.foto != null && !#strings.isEmpty(profesional.foto)} ? 'd-none' : 'fa-solid fa-camera text-light fa-2x'"></i>
												</div>
											</div>
											<div class="col">
												<label class="form-label fw-bold small">Adjuntar
													Fotografía</label> <input type="file" name="file" id="file"
													class="form-control form-control-sm" accept="image/*"
													onchange="previewImage(this)" />
											</div>
										</div>
									</div>
								</div>

								<!-- ACCIONES -->
								<div class="col-12 mt-3 pt-2">
									<div class="d-flex gap-2">
										<button type="submit" id="btnGuardar"
											class="btn btn-success flex-grow-1 fw-bold py-2 shadow">
											<i class="fa-solid fa-save me-2"></i>GUARDAR DATOS
										</button>
										<a th:href="@{/listar}"
											class="btn btn-outline-secondary px-4 fw-bold py-2">
											VOLVER </a>
									</div>
								</div>
							</div>
							<input type="hidden" th:field="*{foto}" />
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<footer th:replace="layout/layout :: footer "></footer>

	<script th:inline="javascript">
		function previewImage(input) {
			const preview = document.getElementById('img-preview');
			const icon = document.getElementById('img-icon');

			if (input.files && input.files[0]) { // Verificamos que haya un archivo
				const reader = new FileReader();

				reader.onload = function(e) {
					preview.src = e.target.result;
					preview.classList.remove('d-none'); // Mostramos la imagen
					if (icon)
						icon.classList.add('d-none'); // Ocultamos el icono
				}

				reader.readAsDataURL(input.files[0]);
			} else {
				// Si el usuario cancela la selección, volvemos al estado inicial
				preview.src = "";
				preview.classList.add('d-none');
				if (icon)
					icon.classList.remove('d-none');
			}
		}

		// Feedback visual al enviar
		document
				.getElementById('formProfesional')
				.addEventListener(
						'submit',
						function() {
							const btn = document.getElementById('btnGuardar');
							btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Guardando...';
							btn.classList.add('disabled');
						});
	</script>
</body>
</html>
