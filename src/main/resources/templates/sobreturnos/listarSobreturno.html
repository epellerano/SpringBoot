												<i class="fa-solid fa-ban"></i>
											</button>
										</div>
									</td>
								</tr>
							</tbody>


						</table>

	<footer th:replace="~{layout/layout :: footer}"></footer>

	<script
		th:replace="sobreturnos/js/funcionesParaListarSobreturnos :: javascript"></script>

	<script th:inline="javascript">
        // FUNCIÓN PARA CANCELACIÓN INDIVIDUAL (POST SEGURO)
        function ejecutarBajaIndividualSobret(id) {
            if (confirm('¿Desea CANCELAR este sobreturno? El registro se mantendrá como cancelado.')) {
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/sobreturnos/eliminar';

                const inputId = document.createElement('input');
                inputId.type = 'hidden';
                inputId.name = 'id';
                inputId.value = id;
                form.appendChild(inputId);

                const tokenMeta = document.querySelector("meta[name='_csrf']");
                if (tokenMeta) {
                    const inputToken = document.createElement('input');
                    inputToken.type = 'hidden';
                    inputToken.name = '_csrf';
                    inputToken.value = tokenMeta.getAttribute("content");
                    form.appendChild(inputToken);
                }

                document.body.appendChild(form);
                form.submit();
            }
        }

        function actualizarInterfazSobreturnos(elemento) {
            if(elemento) resaltarFilaSobreturno(elemento);
            const seleccionados = document.querySelectorAll('.check-sobreturno:checked').length;
            const botonMasivo = document.getElementById('btnSobreturnosMasivo');
            const botonesIndividuales = document.querySelectorAll('.btn-individual-sobreturno');
            
            if (seleccionados > 1) {
                botonMasivo.style.display = 'block';
                botonesIndividuales.forEach(btn => btn.classList.add('disabled-mode'));
            } else {
                botonMasivo.style.display = 'none';
                botonesIndividuales.forEach(btn => btn.classList.remove('disabled-mode'));
            }
        }

        function seleccionarTodosSobreturnos(source) {
            const checkboxes = document.querySelectorAll('.check-sobreturno');
            checkboxes.forEach(cb => {
                cb.checked = source.checked;
                resaltarFilaSobreturno(cb);
            });
            actualizarInterfazSobreturnos();
        }

        function resaltarFilaSobreturno(checkbox) {
            const fila = checkbox.closest('tr');
            if (checkbox.checked) fila.classList.add('row-selected');
            else fila.classList.remove('row-selected');
        }

        function enviarCancelacionSobreturnosMasiva() {
            const seleccionados = document.querySelectorAll('.check-sobreturno:checked');
            const ids = Array.from(seleccionados).map(cb => cb.value);

            if (ids.length === 0) return;
            const token = $("meta[name='_csrf']").attr("content");
            const header = $("meta[name='_csrf_header']").attr("content");

            Swal.fire({
                title: '¿Confirmar Cancelación?',
                text: `Se cancelarán ${ids.length} sobreturnos seleccionados.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#0d6efd',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Sí, Confirmar',
                cancelButtonText: 'No, Volver'
            }).then((result) => {
                if (result.isConfirmed) {
                    $.ajax({
                        url: "/sobreturnos/cancelar-multiple",
                        type: "POST",
                        data: { ids: ids },
                        traditional: true,
                        beforeSend: function(xhr) {
                            if (header && token) { xhr.setRequestHeader(header, token); }
                        },
                        success: function(res) {
                            if (res === "OK") {
                                seleccionados.forEach(cb => {
                                    $(cb).closest('tr').fadeOut(600, function() { 
                                        $(this).remove(); 
                                        actualizarInterfazSobreturnos();
                                    });
                                });
                                location.reload(); // Recarga para limpiar la vista según tu flujo
                            }
                        }
                    });
                }
            });
        }

        function limpiarFiltrosLocal() {
            document.getElementById('filtroBusquedaApellido').value = '';
            document.getElementById('filtroBusquedaDni').value = '';
            if(typeof filtrarTabla === 'function') filtrarTabla();
        }
    </script>
</body>
</html> -->

										th:if="${sobreturno.estado.id != 9 && sobreturno.estado.id != 4}"
										class="badge bg-secondary"
										th:text="${sobreturno.estado.nombre}"></span></td>

									<!-- COLUMNA ATENDER (Solo visible para MÉDICO y en VERDE) -->
									<td class="text-center" sec:authorize="hasRole('ROLE_MEDICO')"
										style="background-color: #f8fafc;">
										<!-- BOTÓN VERDE: Solo si está Ocupado (ID 4) --> <a
										th:if="${sobreturno.estado.id == 4}"
										th:href="@{/consultorio/atender/{id}(id=${sobreturno.paciente.id}, sobreturno=${sobreturno.id})}"
										class="btn btn-sm btn-success fw-bold shadow-sm"
										style="padding: 5px 15px; border-radius: 4px; min-width: 115px;">
											<i class="fa-solid fa-stethoscope me-1"></i> ATENDER
									</a> <!-- BOTÓN AZUL: Solo si ya fue Atendido (ID 9) --> <a
										th:if="${sobreturno.estado.id == 9}"
										th:href="@{/consultorio/atender/{id}(id=${sobreturno.paciente.id}, sobreturno=${sobreturno.id})}"
										class="btn btn-sm btn-outline-primary fw-bold"
										style="padding: 5px 15px; border-radius: 4px; min-width: 115px;">
											<i class="fa-solid fa-eye me-1"></i> VER FICHA
									</a>
									</td>

									<!-- ACCIONES ADMINISTRATIVAS (Grisadas si es MÉDICO) -->
									<td class="text-center">
										<div class="d-flex justify-content-center gap-1"
											th:style="${#authorization.expression('hasRole(''ROLE_MEDICO'')') ? 'pointer-events: none; opacity: 0.5;' : ''}">
											<button type="button"
												class="btn btn-action-turno btn-outline-info btn-individual-sobreturno"
												th:onclick="|printSobreturno('${sobreturno.id}')|">
												<i class="fa-solid fa-print"></i>
											</button>
											<a
												th:href="@{/sobreturnos/formSobreturno(profId=${sobreturno.profesional.id}, especId=${sobreturno.especialidad.id})}"
												class="btn btn-action-turno btn-outline-success btn-individual-sobreturno">
												<i class="fa-solid fa-hand-point-left"></i>
											</a>
											<button type="button"
												class="btn btn-action-turno btn-outline-danger btn-individual-sobreturno"
												th:onclick="'ejecutarBajaIndividualSobret(' + ${sobreturno.id} + ')'">
												<i class="fa-solid fa-ban"></i>
											</button>
										</div>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>

	<footer th:replace="~{layout/layout :: footer}"></footer>	

	<script
		th:replace="sobreturnos/js/funcionesParaListarSobreturnos :: javascript"></script>

	<script th:inline="javascript">
        function ejecutarBajaIndividualSobret(id) {
            if (confirm('¿Desea CANCELAR este sobreturno?')) {
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/sobreturnos/eliminar';
                const inputId = document.createElement('input');
                inputId.type = 'hidden'; name = 'id'; inputId.value = id;
                form.appendChild(inputId);
                const token = document.querySelector("meta[name='_csrf']");
                if (token) {
                    const inputToken = document.createElement('input');
                    inputToken.type = 'hidden'; name = '_csrf'; inputToken.value = token.getAttribute("content");
                    form.appendChild(inputToken);
                }
                document.body.appendChild(form);
                form.submit();
            }
        }

        function actualizarInterfazSobreturnos(elemento) {
            if(elemento) resaltarFilaSobreturno(elemento);
            const seleccionados = document.querySelectorAll('.check-sobreturno:checked').length;
            const botonMasivo = document.getElementById('btnSobreturnosMasivo');
            const botonesIndividuales = document.querySelectorAll('.btn-individual-sobreturno');
            if (seleccionados > 1) {
                botonMasivo.style.display = 'block';
                botonesIndividuales.forEach(btn => btn.classList.add('disabled-mode'));
            } else {
                botonMasivo.style.display = 'none';
                botonesIndividuales.forEach(btn => btn.classList.remove('disabled-mode'));
            }
        }

        function seleccionarTodosSobreturnos(source) {
            document.querySelectorAll('.check-sobreturno').forEach(cb => {
                cb.checked = source.checked;
                resaltarFilaSobreturno(cb);
            });
            actualizarInterfazSobreturnos();
        }

        function resaltarFilaSobreturno(checkbox) {
            const fila = checkbox.closest('tr');
            if (checkbox.checked) fila.classList.add('row-selected');
            else fila.classList.remove('row-selected');
        }

        function enviarCancelacionSobreturnosMasiva() {
            const seleccionados = document.querySelectorAll('.check-sobreturno:checked');
            const ids = Array.from(seleccionados).map(cb => cb.value);
            if (ids.length === 0) return;
            Swal.fire({
                title: '¿Confirmar?', text: `Se cancelarán ${ids.length} sobreturnos.`, icon: 'warning',
                showCancelButton: true, confirmButtonText: 'Sí, Confirmar'
            }).then((result) => {
                if (result.isConfirmed) {
                    $.ajax({
                        url: "/sobreturnos/cancelar-multiple", type: "POST", data: { ids: ids }, traditional: true,
                        success: function(res) { if (res === "OK") location.reload(); }
                    });
                }
            });
        }

        function limpiarFiltrosLocal() {
            document.getElementById('filtroBusquedaApellido').value = '';
            document.getElementById('filtroBusquedaDni').value = '';
            if(typeof filtrarTabla === 'function') filtrarTabla();
        }
    </script>
	<script>
    function consultarServidor(idConsulta) {
        // Usamos el mismo endpoint que en el consultorio
        fetch('/consultorio/detalle-historia/' + idConsulta)
            .then(res => res.json())
            .then(data => {
                // Llenamos el encabezado del panel
                document.getElementById('ref-fecha-medico').innerText = `Consulta: ${data.fecha} - Dr. ${data.medico}`;

                // Llenamos el contenido clínico
                const contenido = `
                    <div class="referencia-item">
                        <label class="label-elite text-danger" style="font-size:0.65rem; font-weight:800; text-transform:uppercase;">Alergias</label>
                        <div class="p-2 mb-3 bg-danger bg-opacity-10 border rounded small text-danger fw-bold">${data.alergias || 'Sin alergias registradas'}</div>
                        
                        <label class="label-elite text-primary border-bottom pb-1 w-100">Evolución Médica</label>
                        <div class="p-3 mb-3 bg-light border rounded" style="max-height: 300px; overflow-y: auto; white-space: pre-wrap; font-size: 0.85rem; line-height: 1.4;">
                            ${data.evolucion || '-'}
                        </div>

                        <label class="label-elite text-success border-bottom pb-1 w-100">Diagnóstico</label>
                        <div class="p-2 mb-3 border rounded fw-bold text-success" style="background-color: #f0fdf4;">
                            ${data.diagnostico || '-'}
                        </div>

                        <label class="label-elite text-info">Indicaciones / Receta</label>
                        <div class="p-2 bg-light border rounded small">${data.indicaciones || '-'}</div>
                    </div>
                `;

                document.getElementById('contenidoReferencia').innerHTML = contenido;

                // Abrimos el panel lateral
                const panelElement = document.getElementById('panelReferencia');
                const panel = bootstrap.Offcanvas.getOrCreateInstance(panelElement);
                panel.show();
            });
    }
    </script>
</body>
</html>
