			//Convertimos a español los dias de la semana de moment.
			function ObtenerDiaEspañol(date) {
  			const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  			return days[moment(date).day()];
			}
	
			// sumamos 1 minuto a turnos libres para convertirlo en sobreturnos.
			function sumarUnMinuto(fechaString) {
				  // 1. Crear un objeto Date a partir de la fecha y hora pasada como parametro.
				  const fecha = new Date(fechaString);

				  // Asegurarse de que la fecha se parseó correctamente
				  if (isNaN(fecha.getTime())) {
				    return "Fecha inválida";
				  }

				  // 2. Obtener los minutos actuales y sumar 1
				  const minutosActuales = fecha.getMinutes();
				  fecha.setMinutes(minutosActuales + 1);

				  // 3. Formatear la fecha al formato deseado (yyyy-MM-dd HH:MM)
				  const año = fecha.getFullYear();
				  const mes = (fecha.getMonth() + 1).toString().padStart(2, '0'); // El mes es 0-indexado
				  const dia = fecha.getDate().toString().padStart(2, '0');
				  const horas = fecha.getHours().toString().padStart(2, '0');
				  const minutos = fecha.getMinutes().toString().padStart(2, '0');

				  return `${año}-${mes}-${dia} ${horas}:${minutos}`;
				}
			
			// sumamos 7 minutos al turno libre obtenido para convertirlo en sobreturno.
			function sumar7Minutos(fecha) {
			  // Convierte la fecha a un objeto Moment.js si aún no lo es
			  const fechaMoment = moment(fecha);			
			  // Suma un minuto a la fecha
			  const fechaConMinutoAgregado = fechaMoment.add(7, 'minute');			
			  // Retorna el resultado (como un objeto de fecha estándar o un string)
			  return moment(fechaConMinutoAgregado).format('mm');
			}

				        success: function(data) {
				            $("#sobreturnosOcupadosTableBody").empty();
				            moment.locale('es-ar');
				            
				            if (data && Array.isArray(data)) {
				                data.forEach(function(sobreturno) {
				                    
				                    // --- EXTRACTOR DE BOX DESDE LA OBSERVACIÓN EN FRONTEND ---
				                    let boxTexto = "---";
				                    let obs = sobreturno.observacion ? String(sobreturno.observacion) : "";
				                    
				                    if (obs.includes("[BOX: ")) {
				                        // Extraemos el número que está entre "[BOX: " y "]"
				                        let inicio = obs.indexOf("[BOX: ") + 6;
				                        let fin = obs.indexOf("]", inicio);
				                        if (fin !== -1) {
				                            let numeroBox = obs.substring(inicio, fin).trim();
				                            // Armamos el texto estético (podes poner "BOX " + numeroBox o solo el número con la clase)
				                            boxTexto = `<span class="text-success fw-bold">BOX ${numeroBox}</span>`;
				                        }
				                    }

				                    let badgeNormal = `<span class="badge bg-primary" style="display: inline-block; width: 130px; text-align: center; font-size: 10px; padding: 4px 0; color: white; font-weight: bold; border-radius: 4px;">SOBRETURNO NORMAL</span>`;

				                    var row = "<tr>" + 
				                                "<td>" + sobreturno.id + "</td>" +
				                                "<td>" + sobreturno.paciente.id + "</td>" +
				                                "<td>" + sobreturno.profesional.id + "</td>" +
				                                "<td>" + sobreturno.especialidad.id + "</td>" +
				                                "<td style='color: blue;'>" + sobreturno.paciente.apellido + " " + sobreturno.paciente.nombre + "</td>" +
				                                "<td style='color: blue;'>" + ObtenerDiaEspañol(sobreturno.rangoFechaHora).toUpperCase() + '  ' + moment(sobreturno.rangoFechaHora).format('DD/MM/YYYY HH:mm') + "</td>" +	                     			      
				                                "<td style='color: MediumSeaGreen; text-align: left;'>" + boxTexto + "</td>" + // <-- INYECTA EL BOX CONVERTIDO AQUÍ
				                                "<td style='text-align: left; vertical-align: middle;'>" + badgeNormal + "</td>" +
				                                "<td><span class='lupa-icono' title='Ver Detalle' style='font-size: 16px; cursor:pointer;'>&#x1F50D;</span></td>" +

				                    $("#sobreturnosOcupadosTableBody").append(row);

			 //Eliminar el horario en sobreturnos libres si este se encuentra en Sobreturnos ocupados.
			function eliminarSobreturnosIguales() {
			 // Obtener las tablas por sus IDs	
			    const tabla1 = document.getElementById('turnosLibresTodos');
			    const tabla2 = document.getElementById('sobreturnosOcupadosTodos');

			    const filasTabla1 = tabla1.getElementsByTagName('tbody')[0].rows;
			    const filasTabla2 = tabla2.getElementsByTagName('tbody')[0].rows;	
			
			    // Asegúrate de recorrer las filas de la tabla 1 para el bucle exterior
			    for (let i = 0; i < filasTabla1.length; i++) {
			    	// Obtenemos la fila Actual
			        const filaActualTabla1 = filasTabla1[i];
			     	// Dentro de esa celda, busca el elemento input con su ID
				    let HoraSobreturno = filaActualTabla1.cells[3].querySelector('#sobreturnoHora').value;
				    let MinutoSobreturno = filaActualTabla1.cells[3].querySelector('#sobreturnoMinuto').value;
				    //Armamos la fecha a comparar con formato EEEE dd/MM/yyyy HH:mm
			        const celdaCollTabla1 = filaActualTabla1.cells[2].innerText.trim() + ' ' + HoraSobreturno + ':' + MinutoSobreturno; //Columna 1
			        
			        
			        // Recorre las filas de la tabla 2 para encontrar coincidencias
			        for (let j = 0; j < filasTabla2.length; j++) {
			            const filaActualTabla2 = filasTabla2[j];
			            const celdaCol1Tabla2 = filaActualTabla2.cells[5].innerText.trim(); // Columna 2
			            
			            // Compara las celdas
			            if(celdaCollTabla1 === celdaCol1Tabla2) {
			                // Si las celdas coinciden, elimina la fila actual de la tabla 1
			                filasTabla1[i].remove();
			                //break; 
			                // No usar break y continuar con el  bucle interno para seguir comparando.
			                eliminarSobreturnosIguales();
			            }
			        }
			    }
			}

		function devolverFormatoMySql(fechaAConvertir) {
		    // Ej: Si fechaAConvertir viene como: "MARTES 08/04/2026 09:00"
		    
		    // 1. Limpiamos el string: quitamos el nombre del día quedándonos con lo último
		    // Buscamos la primera barra "/" para saber dónde empieza la fecha real
		    const soloFechaHora = fechaAConvertir.substring(fechaAConvertir.indexOf(" ") + 1).trim();
		    // Ahora soloFechaHora es: "08/04/2026 09:00"

		    // 2. Definimos el formato de entrada (solo los números)
		    const inputFormat = "DD/MM/YYYY HH:mm";
		    
		    // 3. Definimos el formato de salida para MySQL
		    const outputFormat = "YYYY-MM-DD HH:mm";

		    // 4. Convertimos
		    const formattedDate = moment(soloFechaHora, inputFormat).format(outputFormat);

		    return formattedDate;
		}

			const diaSemana = fechaHoraActual.toLocaleDateString('es-AR',
