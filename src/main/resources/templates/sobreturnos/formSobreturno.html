<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head th:replace="layout/layout :: head "></head>

<style>

/* BOTÓN GUARDAR ELITE */
.btn-guardar-elite {
	background-color: #10b981; /* Un verde esmeralda más sofisticado */
	color: #ffffff;
	border: none;
	border-radius: 8px;
	height: 45px;
	font-weight: 700;
	font-size: 14px;
	letter-spacing: 1px;
	text-transform: uppercase;
	transition: all 0.3s ease;
	box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 10px;
}

.btn-guardar-elite:hover {
	background-color: #059669;
	/* Verde un poco más oscuro al pasar el mouse */
	transform: translateY(-1px);
	box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
	color: #ffffff;
}

.btn-guardar-elite:active {
	transform: translateY(0);
}

.btn-guardar-elite i {
	font-size: 18px;
}

/* Estilo para profesionalizar los botones pequeños sin usar height fijo */
.custom-btn-mini {
	padding: 4px 8px;
	font-size: 10.5px;
	font-weight: 700;
	letter-spacing: 0.5px;
	color: #546e7a !important; /* Gris profesional */
	border-color: #ffc107; /* Amarillo Bootstrap */
	transition: all 0.2s ease;
}

.custom-btn-mini:hover {
	background-color: #fff9e6; /* Un fondo sutil al pasar el mouse */
	color: #37474f !important;
}

.custom-btn-mini i {
	font-size: 12px;
}

/* DISEÑO DE BOTONES DE DÍAS ELITE */
.day-selector-container input[type="radio"] {
	display: none;
}

.day-btn {
	display: flex;
	align-items: center;
	justify-content: center;
	height: 28px;
	font-size: 10px;
	font-weight: 800;
	color: #64748b; /* Gris azulado para días inactivos */
	border-radius: 4px;
	cursor: pointer;
	transition: all 0.2s ease;
	text-transform: uppercase;
	margin: 0;
	border: 1px solid transparent;
}

/* Estilo inicial para el botón TODOS (texto rojo, fondo blanco) */
.day-btn-todos {
	color: #ef4444;
}

.day-btn:hover {
	background-color: #f8f9fa;
}

/* Estado cuando CUALQUIER día está seleccionado (Fondo Azul, Texto Blanco) */
.day-selector-container input[type="radio"]:checked+.day-btn {
	background-color: #0052cc;
	color: #ffffff !important;
	box-shadow: 0 2px 4px rgba(0, 82, 204, 0.2);
}

/* Estado específico para el botón TODOS cuando se activa */
/* Cambia el fondo a rojo y fuerza el texto a blanco para que sea legible */
.day-selector-container input[type="radio"]:checked+.day-btn-todos {
	background-color: #ef4444 !important;
	color: #ffffff !important;
	box-shadow: 0 2px 4px rgba(239, 68, 68, 0.2);
}
</style>

	<script>
	document.getElementById("myForm").addEventListener("submit", function(event) {
        event.preventDefault(); // Detenemos el envío normal para que no se borre la página

        // 1. Tus validaciones básicas (Paciente / Profesional)
        if (document.getElementById('isCheckPaciente').checked === false || 
            document.getElementById('isCheckProfEsp').checked === false) {
            Swal.fire({
                icon: "error",
                title: "Lo sentimos.. Algo Salió mal..",
                html: "Datos Incompletos.<br>Verifique todos los campos por favor..."
            });
            return;
        }

        // 2. Validación de Horario Seleccionado
        if (document.getElementById('isCheckTurnoSeleccionado').checked === false) {
            Swal.fire({
                icon: "error",
                title: "Lo sentimos.. Algo Salió mal..",
                html: "Datos Incompletos.<br>Seleccione un Horario por favor..."
            });
            return;
        }

        // 3. SI TODO ESTÁ BIEN, ENVIAMOS POR AJAX
        enviarFormularioAjax(this);
    });

	function enviarFormularioAjax(form) {
	    $.ajax({
	        url: $(form).attr("action"),
	        type: "POST",
	        data: $(form).serialize(),
	        success: function(response) {
	            // El servidor respondió 200 OK (Se guardó en la BD)
	            Swal.fire({
	                icon: "success",
	                title: "¡Logrado!",
	                text: "Sobreturno guardado con éxito.", // Esto reemplaza al [[${mensaje}]] de éxito EN formSobreturno
	                confirmButtonText: "Ir a la lista",
	                allowOutsideClick: false
	            }).then((result) => {
	                // ESTA LÍNEA HACE LA REDIRECCIÓN MANUAL
	                if (result.isConfirmed || result.isDismissed) {
	                    window.location.href = "/sobreturnos/listarSobreturno";
	                }
	            });
	        },
	        error: function(xhr) {
	            if (xhr.status === 409) {
	                // Error de horario ocupado: NO REDIRIGE, se queda para que elija otro
	                Swal.fire({
	                    icon: "warning",
	                    title: "Horario Ocupado",
	                    text: "Este bloque Horario ya fue tomado por otro operador." // Esto reemplaza al [[${mensaje}]] de error EN formSobreturno
	                });
	            } else {
	                Swal.fire({
	                    icon: "error",
	                    title: "Error",
	                    text: "Hubo un problema al procesar el sobreturno."
	                });
	            }
	        }
	    });
	}
	
	function sincronizarSobreturno(input) {
	    const val = input.value;
	    const options = document.querySelectorAll('#profesionalesListSobr option');
	    const realSelect = document.getElementById('profesional');
	    
	    for (let opt of options) {
	        if (opt.value === val) {
	            realSelect.value = opt.getAttribute('data-id');
	            
	            // Disparamos evento para que se carguen especialidades y agenda de sobreturnos
	            realSelect.dispatchEvent(new Event('change'));

	            if (typeof cargarEspecialidades === "function") {
	                cargarEspecialidades();
	            }
	            input.blur();
	            break;
	        }
	    }
	}

	function limpiarBuscadorSobreturno(input) {
	    input.value = '';
	    const realSelect = document.getElementById('profesional');
	    if (realSelect) {
	        realSelect.value = "";
	        // Notificamos el cambio para limpiar las tablas de abajo
	        realSelect.dispatchEvent(new Event('change'));
	    }
	    
	    // Limpieza de campos dependientes
	    const especSelect = document.getElementById('especialidad');
	    if (especSelect) especSelect.innerHTML = ""; 
	    
	    const fotoMedico = document.getElementById('fotoMedico');
	    if (fotoMedico) fotoMedico.style.display = 'none';
	    
	    const fotoDefault = document.getElementById('fotoDefault');
	    if (fotoDefault) fotoDefault.style.display = 'flex';
	}
	
	//BOTON ALTA EXPRESS SOBRETURNOS UNIFICADO CON ICONOS SOLDADOS ELITE
		$(document).ready(function() {
		    // 1. ACOPLE VERTICAL ELITE SEGURO (CON TU PALABRA 'ALTA' Y SIN CONGELAR SWITCHES)
		    let inputApeNom = $("#buscar_pacienteApeNom").closest(".input-group");
		    let inputDni = $("#buscar_pacienteDni").closest(".input-group");
		    let columnaPaciente = $("#buscar_pacienteApeNom").closest(".col-md-3");
		    
		    if (inputApeNom.length > 0 && inputDni.length > 0 && $("#btnAltaParticularExpress").length === 0) {
		        // Quitamos el borde derecho original de la columna grande
		        columnaPaciente.removeClass("border-end");
		
		        // Envolvemos SOLO a los dos buscadores en un mini contenedor flex vertical propio
		        let contenedorBuscadores = $('<div class="d-flex flex-column justify-content-between" style="height: 64px; flex-grow: 1;"></div>');
		        inputApeNom.before(contenedorBuscadores);
		        contenedorBuscadores.append(inputApeNom).append(inputDni);
		
		        // Diseñamos el botón vertical con tu palabra "ALTA"
		        let botonVerticalHtml = `
		            <button type="button" id="btnAltaParticularExpress" class="btn btn-sm btn-primary d-flex flex-column align-items-center justify-content-center p-1" 
		                    style="width: 32px; height: 64px; font-size: 9px; font-weight: 800; border-radius: 4px; letter-spacing: 0.5px; line-height: 1.1; flex-shrink: 0;"
		                    data-bs-toggle="modal" data-bs-target="#modalAltaParticular" title="Alta Exprés Particular">
		                <i class="fas fa-user-plus mb-1" style="font-size: 11px;"></i>
		                <span>A</span><span>L</span><span>T</span><span>A</span>
		            </button>
		            <!-- Línea divisoria vertical de tu diseño corporativo -->
		            <div id="lineaDivisoriaParticular" style="width: 1px; height: 75px; background-color: #dee2e6; flex-shrink: 0;" class="ms-1"></div>
		        `;
		
		        // Agrupamos el mini bloque de buscadores junto al botón de forma horizontal limpia
		        let wrapperPacienteElite = $('<div class="d-flex align-items-center gap-2 w-100"></div>');
		        contenedorBuscadores.before(wrapperPacienteElite);
		        wrapperPacienteElite.append(contenedorBuscadores).append(botonVerticalHtml);
		    }
		
		    // 2. INYECTAMOS EL MODAL CON INPUTS ELITE SOLDADOS (FONT AWESOME INTEGRADO)
		    let modalParticularHtml = `
		    <div class="modal fade" id="modalAltaParticular" tabindex="-1" aria-labelledby="modalAltaParticularLabel" aria-hidden="true" style="z-index: 1055;">
		      <div class="modal-dialog modal-dialog-centered modal-sm">
		        <div class="modal-content" style="border-radius: 6px; overflow: hidden; border: 1px solid #dee2e6;">
		          <div class="modal-header bg-success text-white py-2 px-3">
		            <h6 class="modal-title" id="modalAltaParticularLabel" style="font-size: 13px; font-weight: bold; margin: 0;">
		                <i class="fas fa-user-plus"></i> Alta Particular Exprés
		            </h6>
		            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close" style="font-size: 10px; box-shadow: none;"></button>
		          </div>
		          <div class="modal-body p-3" style="font-size: 13px; background: #ffffff;">
		            <form id="formAltaParticularExpres">
		              <div class="mb-2">
		                <label class="form-label mb-0 fw-bold text-muted" style="font-size: 11px;">DNI / Documento</label>
		                <div class="input-group" style="height: 30px; border: 1px solid #dee2e6; border-radius: 4px; overflow: hidden; background: white;">
		                  <span class="input-group-text bg-white border-0" style="padding-right: 5px;"><i class="fas fa-id-card" style="font-size: 13px; color: #0052cc;"></i></span>
		                  <input type="number" class="form-control form-control-sm border-0 shadow-none" id="partDni" required style="font-size: 13px; height: 100%;" />
		                </div>
		              </div>
		              <div class="mb-2">
		                <label class="form-label mb-0 fw-bold text-muted" style="font-size: 11px;">Apellido</label>
		                <div class="input-group" style="height: 30px; border: 1px solid #dee2e6; border-radius: 4px; overflow: hidden; background: white;">
		                  <span class="input-group-text bg-white border-0" style="padding-right: 5px;"><i class="fas fa-user" style="font-size: 13px; color: #0052cc;"></i></span>
		                  <input type="text" class="form-control form-control-sm border-0 shadow-none" id="partApellido" required style="font-size: 13px; height: 100%; text-transform: uppercase;" />
		                </div>
		              </div>
		              <div class="mb-2">
		                <label class="form-label mb-0 fw-bold text-muted" style="font-size: 11px;">Nombre</label>
		                <div class="input-group" style="height: 30px; border: 1px solid #dee2e6; border-radius: 4px; overflow: hidden; background: white;">
		                  <span class="input-group-text bg-white border-0" style="padding-right: 5px;"><i class="fas fa-signature" style="font-size: 13px; color: #0052cc;"></i></span>
		                  <input type="text" class="form-control form-control-sm border-0 shadow-none" id="partNombre" required style="font-size: 13px; height: 100%; text-transform: uppercase;" />
		                </div>
		              </div>
		              <div class="mb-2">
		                <label class="form-label mb-0 fw-bold text-muted" style="font-size: 11px;">Email (Comprobantes)</label>
		                <div class="input-group" style="height: 30px; border: 1px solid #dee2e6; border-radius: 4px; overflow: hidden; background: white;">
		                  <span class="input-group-text bg-white border-0" style="padding-right: 5px;"><i class="fas fa-envelope" style="font-size: 13px; color: #0052cc;"></i></span>
		                  <input type="email" class="form-control form-control-sm shadow-none" id="partEmail" required style="font-size: 13px; height: 100%;" />
		                </div>
		              </div>
		              <div class="text-end mt-3">
		                <button type="button" class="btn btn-sm btn-secondary py-1" data-bs-dismiss="modal" style="font-size: 12px; height: 28px;">Cancelar</button>
		                <button type="submit" class="btn btn-sm btn-success py-1 fw-bold" style="font-size: 12px; height: 28px;"><i class="fas fa-save"></i> Registrar</button>
		              </div>
		            </form>
		          </div>
		        </div>
		      </div>
		    </div>`;
		    
		    if ($("#modalAltaParticular").length === 0) {
		        $("body").append(modalParticularHtml);
		    }
		
		    // 3. ESCUCHADOR DEL AJAX CON TU URL ORIGINAL RESPETADA AL 100%
		    $(document).off("submit", "#formAltaParticularExpres").on("submit", "#formAltaParticularExpres", function(e) {
		        e.preventDefault();
		
		        const datos = {
		            dni: $("#partDni").val(),
		            apellido: $("#partApellido").val(),
		            nombre: $("#partNombre").val(),
		            email: $("#partEmail").val()
		        };
		
		        const tokenCsrf = $("input[name='_csrf']").val() || $("meta[name='_csrf']").attr("content");
		        const headerCsrf = $("meta[name='_csrf_header']").attr("content") || "X-CSRF-TOKEN";
		
		        $.ajax({
		            url: "/sobreturnos/formPacienteExpress", // <-- TU ENDPOINT DE SOBRETURNOS RESTAURADO
		            method: "POST",
		            data: datos,
		            beforeSend: function(xhr) {
		                if (tokenCsrf) {
		                    xhr.setRequestHeader(headerCsrf, tokenCsrf);
		                }
		            },
		            success: function(res) {
		                let json = typeof res === "string" ? JSON.parse(res) : res;
		                if (json.status === "success") {
		                    $("#pacienteId").val(json.id);
		                    $("#pacientedniId").val(json.id);
		                    
		                    $("#buscar_pacienteApeNom").val(datos.apellido.toUpperCase() + " " + datos.nombre.toUpperCase());
		                    $("#buscar_pacienteDni").val(datos.dni);
		
		                    let checkPac = document.getElementById('isCheckPaciente');
		                    if(checkPac) {
		                        checkPac.checked = true;
		                    }
		
		                    // Limpieza profunda anti-congelamiento de Bootstrap
		                    $("#modalAltaParticular").modal("hide"); 
		                    $(".modal-backdrop").remove();          
		                    $("body").removeClass("modal-open");     
		                    $("body").css("overflow", "auto");       
		                    
		                    document.getElementById("formAltaParticularExpres").reset();
		
		                    Swal.fire({
		                        title: "¡Paciente Creado!",
		                        text: "Ya quedó seleccionado de forma automática. Continuá con el sobreturno.",
		                        icon: "success",
		                        timer: 2000,
		                        showConfirmButton: false
		                    });
		                }
		            },
		            error: function(xhr) {
		                if (xhr.status === 409) {
		                    Swal.fire("Atención", "Este DNI ya corresponde a un paciente registrado.", "warning");
		                } else {
		                    Swal.fire("Error", "No se pudo registrar el paciente en el servidor.", "error");
		                }
		            }
		        });
		    });
		});

	</script>
