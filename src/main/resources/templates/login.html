<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="stylesheet" th:href="@{/css/login.css}" />
<link rel="stylesheet" th:href="@{/css/awesome/all.min.css}" />
<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>
<style>
body {
	margin: 0;
	padding: 0;
	height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	background: #1a202c;
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.login-container {
	width: 100%;
	max-width: 480px;
	padding: 20px;
	display: flex;
	flex-direction: column;
	align-items: center;
}

.center-img {
	width: 100px;
	height: auto;
	margin-bottom: 20px;
	filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
}

.label-sigat {
	color: white;
	font-weight: 800;
	letter-spacing: 1px;
	text-transform: uppercase;
	text-align: center;
	margin-bottom: 25px;
	width: 100%;
}

.form-box {
	width: 100%;
	border: 1px solid rgba(255, 255, 255, 0.2);
	border-radius: 12px;
	background-color: rgba(255, 255, 255, 0.05);
	padding: 30px;
	backdrop-filter: blur(5px);
}

/* Contenedor del encabezado del logo */
.logo-wrapper {
	display: flex;
	flex-direction: column;
	align-items: center; /* Centra horizontalmente */
	justify-content: center;
	width: 100%;
	margin-bottom: 20px;
}

.imagen-trebol {
	width: 100px;
	height: auto;
	display: block; /* Elimina espacios residuales */
	margin: 0 auto; /* Centrado clásico de respaldo */
	filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
}

.label-sigat {
	width: 100%;
	text-align: center; /* Centra el texto debajo del logo */
	color: white;
	font-weight: 800;
	text-transform: uppercase;
	margin-top: 10px;
}
</style>
</head>
<body>
	<header
		style="position: absolute; top: 0; width: 100%; color: white; text-align: center;">
		<div class="alert alert-success" th:if="${success != null}"
			th:text="${success}" id="myAlert"></div>
		<div class="alert alert-danger" role="alert" th:if="${error != null}"
			th:text="${error}" id="myAlert"></div>
	</header>

	<div class="login-container">
		<div class="logo-wrapper">
			<img th:src="@{/images/trebol.png}" alt="logo" class="imagen-trebol">
			<p class="label-sigat">SIGAT<br>Sistema General Administrativo de Tunros</p>
		</div>

		<form th:action="@{/login}" method="post" class="w-100">
			<div class="form-box shadow-lg">
				<div class="mb-3">
					<input type="text" autocomplete="off" class="form-control"
						name="username" placeholder="👤 nombre de usuario" value="admin">
				</div>
				<!-- INPUT GROUP CORREGIDO -->
				<div class="input-group mb-3">
					<input type="password" class="form-control" name="password"
						id="password" placeholder="🔒 contraseña" value="12345"
						style="height: 45px; border-right: none;"> <span
						class="input-group-text" onclick="peakPassword()"
						style="cursor: pointer; background: white; border-left: none;">
						<i class="fa-solid fa-eye" id="eyeIcon"
						style="color: #666; width: 20px;"></i>
					</span>
				</div>

				<button type="submit"
					class="btn btn-primary w-100 fw-bold shadow-sm"
					style="height: 45px; background-color: #0d6efd !important; border: none;">
					INICIAR SESIÓN</button>

				<div class="text-center">
					<a class="small text-white-50 text-decoration-none" href="#!">¿Olvidó
						su contraseña?</a>
					<p class="mt-3 mb-0" style="color: white; font-size: 0.85rem;">
						¿No tienes cuenta? <a th:href="@{/registro/nuevo}"
							style="color: #0dcaf0; font-weight: bold; text-decoration: none;">Regístrate
							aquí</a>
					</p>
				</div>
			</div>
			<input type="hidden" th:name="${_csrf.parameterName}"
				th:value="${_csrf.token}" />
		</form>

		<div class="mt-4 small text-center"
			style="color: rgba(255, 255, 255, 0.5);">
			© 2025 - 2026 <a class="text-white-50 text-decoration-none"
				href="https://www.linkedin.com/in/pellerano-eduardo-andrés-965a7560"
				target="_blank">AndresBrain</a>.
		</div>
	</div>

	<script th:src="@{/js/bootstrap.min.js}"></script>
	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
	<script th:src="@{/js/sweetalert2.all.min.js}"></script>
	<script th:src="@{/js/awesome/all.min.js}"></script>
	<script th:src="@{/js/sweetalert2.all.min.js}"></script>
	<script>
        function peakPassword() {
            const field = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                field.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
        setTimeout(() => { document.getElementById("myAlert")?.remove(); }, 4000);
    </script>
    <script th:inline="javascript">
		/*<![CDATA[*/
		var msgSuccess = /*[[${success}]]*/null;
		var msgError = /*[[${error}]]*/null;

		if (msgSuccess) {
			Swal.fire({
				title : '¡Operación Exitosa!',
				text : msgSuccess,
				icon : 'success',
				confirmButtonColor : '#0d6efd',
				confirmButtonText : 'Entendido'
			});
		}

		if (msgError) {
			Swal.fire({
				title : 'Error',
				text : msgError,
				icon : 'error',
				confirmButtonColor : '#dc3545',
				confirmButtonText : 'Volver a intentar'
			});
		}

		setTimeout(function() {
			var alertElement = document.getElementById("myAlert");
			if (alertElement)
				alertElement.remove();
		}, 4000);
		/*]]>*/
	</script>
</body>
</html>
