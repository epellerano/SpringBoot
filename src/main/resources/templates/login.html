<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- <head th:replace="layout/layout :: head "></head> -->

<head>
<link rel="styLesheet" th:href="@{/css/login.css}" />
<link rel="styLesheet" th:href="@{/css/awesome/all.min.css}" />
<link rel="styLesheet" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>
	<!-- <header th:replace="layout/layout :: header "></header> -->
	<header style="color: white;">
		<!-- para mostrar los mensajes -->

		<div class="alert alert-success" th:if="${success != null}"
			th:text="${success}" id="myAlert"></div>
		<div class="alert alert-danger" role="alert" th:if="${error != null}"
			th:text="${error}" id="myAlert"></div>
		<div class="alert alert-warning" th:if="${warning != null}"
			th:text="${warning}" id="myAlert"></div>
		<div class="alert alert-info" th:if="${info != null}"
			th:text="${info}" id="myAlert"></div>

	</header>


	<div class="login">


		<!-- <div class="center">
		<h1>Sigat - Sistema General Administrativo de Turnos</h1>
          <img th:src="@{/images/trebol.png}" style="margin-left: 1px; width: 105px; height: 95px;" alt="logo"> 
        </div> -->


		<!-- <img th:src="@{/images/trebol.png}" style="margin-left: 1px; width: 105px; height: 95px;" alt="logo"> -->
		<div class="center">
			<img th:src="@{/images/trebol.png}" alt="logo"
				class="imagen-flotante">
		</div>

		<p class="label-sigat">SIGAT - Sistema General Administrativo de
			Turnos</p>
		<!-- ESPACIO DESPUES DE LA LINEA -------------------------------------------------------------------------------->
		<!-- <div
			style="display: flex; border-bottom: 1px solid yellowgreen; width: 100%; margin-top: -20px; margin-bottom: 25px;"></div>
		<h1 class="text-secondary pb-0"></h1> -->
		<!--------------------------------------------------------------------------------------------------------------->



		<form th:action="@{/login}" method="post">
			<div class="overflow-hidden"
				style="border: 1px solid lightgray; height: 253.16px; border-radius: 0.5em; background-color: transparent; padding: 15px;">



				<div style="margin-top: 15px; margin-bottom: 15px;"
					class="input-group">
					<input type="text" autocomplete="off" class="form-control"
						value="admin" name="username"
						placeholder="&#128100; nombre de usuario">
				</div>

				<div style="margin-bottom: 15px" class="input-group">
					<input type="password" autocomplete="off" class="form-control"
						value="12345" name="password" id="password"
						placeholder="&#128274; contraseña"> <span
						class="fa fa-eye" id="togglePassword" th:onClick="peakPassword();"
						style="width: 15px; height: 15px; padding: 12px; color: dimgray; background-color: WhiteSmoke;"></span>
				</div>

				<button type="submit" for="button"
					class="btn btn-primary btn-block btn-large">Iniciar Sesión
				</button>

				<input type="hidden" th:name="${_csrf.parameterName}"
					th:value="${_csrf.token}" /> <br> <a class="forgot-password"
					href="#!">Olvidó su contraseña?</a>
				<p class="have-account">
					Si Aún no tienes una cuenta &raquo; <a class="register-here"
						href="#!">Iniciar registro aquí</a>
				</p>
			</div>

			<div class="derechos-reservados">
				<p style="width: 450px;">
					© 2025 - 2026 <a class="linkedin" href="https://www.linkedin.com/in/pellerano-eduardo-andrés-965a7560" target="_blank">AndresBrain</a>.
					Todos los derechos Reservados.
				</p>
			</div>
		</form>

	</div>

	<script>
		setTimeout(function() {
			var alertElement = document.getElementById("myAlert");
			if (alertElement) {
				alertElement.remove();
			}
		}, 4000); // 3000 milisegundos = 3 segundos

		function peakPassword() {
			const icono = document.getElementById('togglePassword');
			var passwordField = document.getElementById('password');

			if (passwordField.getAttribute('type') === 'password') {
				if (passwordField.value !== '') {
					passwordField.setAttribute('type', 'text');
					icono.classList.add('fa-eye-slash');

				}
			} else {
				passwordField.setAttribute('type', 'password');
				icono.classList.remove('fa-eye-slash');
				icono.classList.add('fa-eye');
			}
		}
	</script>
	<script th:src="@{/js/awesome/all.min.js}"></script>
	<script th:src="@{/js/bootstrap.min.js}"></script>
	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

	<!-- <footer th:replace="layout/layout :: footer "></footer>	 -->

</body>
</html>
