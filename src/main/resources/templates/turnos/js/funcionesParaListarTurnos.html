<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
	<script type="text/javascript" th:fragment="javascript">
	
	//Convertimos a español los dias de la semana de moment.
	function ObtenerDiaEspañol(date) {
		const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
		return days[moment(date).day()];
	}
	
	//Funcion Ver datos del turno y reimprimir por id mediante la funcion que escucha click en icono impresora.
	  function printTurno(turno_id) {
		//Continuamos
		$.ajax({
     url: "/api/turnosLibresController/obtener-turno-id/" + turno_id,
		method: "GET",
		success: function(data) { 
         moment.locale('es-ar');
         data.forEach(function(turno) {
            
            // 1. SANITIZACIÓN ABSOLUTA DE FECHAS (Previene nulos si es sobreturno)
            let fechaRaw = (turno.planilladetalle && turno.planilladetalle.rangoFechaHora) ? turno.planilladetalle.rangoFechaHora : (turno.rangoFechaHora || new Date());
            let stringFechaYHora = ObtenerDiaEspañol(fechaRaw) + ' ' + moment(fechaRaw).format('DD/MM/YYYY HH:mm');

            // 2. CONTROL DEL BOX (Solo se crea si el texto es válido)
            let valorBox = (turno.planilladetalle && turno.planilladetalle.box) ? String(turno.planilladetalle.box).trim() : '';
            let lineaBoxHtml = (valorBox !== '' && valorBox !== 'null' && valorBox !== 'undefined') ? `
                <span style='float: left;'>Box / Consultorio:</span><span style='float: left; color: green; font-weight: bold;'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;BOX NRO ${valorBox}</span><br>
            ` : '';

            // 3. TEXTOS DE RESPALDO (Previene errores por strings nulos)
            let profesionalTxt = (turno.profesional && turno.profesional.apellido) ? (turno.profesional.apellido + ' ' + (turno.profesional.nombre || '')) : 'S/P';
            let especialidadTxt = (turno.especialidad && turno.especialidad.especialidadNombre) ? (turno.especialidad.especialidadCodigo + ' - ' + turno.especialidad.especialidadNombre) : 'S/E';
            let pacienteTxt = (turno.paciente && turno.paciente.apellido) ? (turno.paciente.apellido + ' ' + (turno.paciente.nombre || '')) : 'S/P';
            let pacienteDni = (turno.paciente && turno.paciente.dni) ? turno.paciente.dni : '';
            let observacionTxt = (turno.observacion) ? turno.observacion : '';

            // 4. DISPARO DEL SWEETALERT SIN RIESGO DE EMBARGO DE FLUJO
            swal.fire({
         	   title: `<h5 style='margin-bottom: -25px;text-decoration: underline;margin-top: -25px;'>COMPROBANTE DEL TURNO ASIGNADO</h5>
         		   <p style='float: center;color: green; font-size: 22px;'>${stringFechaYHora}</p><hr style='margin-bottom: -5px;'>`,
		      html: `
		    	  <span style='float: left;'>Profesional Seleccionado:</span><span style='float: left; color: blue;'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${profesionalTxt.toUpperCase()}</span><br>
		    	  <span style='float: left;;'>Especialidad Seleccionada:</span><span style='float: left; color: blue;'>&nbsp;&nbsp;&nbsp;${especialidadTxt.toUpperCase()}</span><br>
		    	  ${lineaBoxHtml}
		    	  <hr>
		    	  <span style='float: left;'>Paciente Apellido Nombre:</span><span style='float: left; color: blue;'>&nbsp;&nbsp;&nbsp;${pacienteTxt.toUpperCase()}</span><br>
		    	  <span style='float: left;'>Paciente Documento:</span><span style='float: left; color: blue;'>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${pacienteDni}</span><br>
		    	  <span style='float: left; '>Observaciones del Turno:</span><span style='text-align: left; position: relative; right: -13; color: blue; display: inline-block; width: 365px; height: 60px; overflow-y: auto; border: 1px solid ghostwhite; margin-bottom: -17px;'>${observacionTxt.toUpperCase()}</span><br>
		    	  <hr>
		    	  <span style='font-family: Arial; font-size: 12px;'>Juan Francisco Segui 1331 - Grand Bourg || Telefonos: 02320-410000/411317/486666</span><br>
		    	  <span style='font-family: Arial; font-size: 12px;'>** Asistir 20 Minutos antes de su hora asignada **</span><br>				    	  				    	  						
		    	  <span style='font-family: Arial; font-size: 12px; text-decoration: underline;'>://centromedicosalud.com</span>
		      `,
		      imageUrl : '/images/termalPrinter-56.png',
		      showDenyButton: true,
		      confirmButtonText: `
		    	    <i class="fa fa-print"></i> Imprimir
		    	  `,
		      denyButtonText: 'Cerrar Ventana',	
		      denyButtonColor: "#3085d6",
		      customClass: {
		      popup: 'swal2-border-custom'
		      }
		      })
		      .then((result) => {
		      if (result.isConfirmed) {
		         Swal.fire('IMPRIMIENDO', 'El turno seleccionado', 'success');
		      }
		      });	                	
         });
         
		},
		error: function(error) {
         console.log(error);
     }
 });
	}


	
	//FUNCION PARA FILTRAR TURNOS POR APELLIDO EN listarTurnos.html
	     document.getElementById('filtroBusquedaApellido').addEventListener('input', function() {
	        var textoFiltro = this.value.toLowerCase(); // Obtiene el texto en minúsculas
	        var filas = document.getElementById('tablaListadoTurnos').getElementsByTagName('tr');
	        //limpia el filtro por Dni
	        const myInputDni = document.getElementById('filtroBusquedaDni');
	        myInputDni.value = '';

	        for (var i = 0; i < filas.length; i++) {
	            var celdaNombre = filas[i].getElementsByTagName('td')[4]; // La cuarta celda es la de nombre
	            
              if (celdaNombre) {
                  var textoCelda = celdaNombre.textContent || celdaNombre.innerText;
                  // Compara el texto del filtro con el texto de la celda (ambos en minúsculas)
                  if ((textoCelda.toLowerCase().indexOf(textoFiltro) > -1)) {
                      filas[i].style.display = ""; // Muestra la fila si hay coincidencia
                  } else {
                      filas[i].style.display = "none"; // Oculta la fila si no hay coincidencia
                  }
              }
	        }
	    }); 
	    
	  //FUNCION PARA FILTRAR TURNOS POR DNI EN listarTurnos.html
	     document.getElementById('filtroBusquedaDni').addEventListener('input', function() {
	        var textoFiltro = this.value.toLowerCase(); // Obtiene el texto en minúsculas
	        var filas = document.getElementById('tablaListadoTurnos').getElementsByTagName('tr');
	        //limpia el filtro por Apellido
	        const myInputApellido = document.getElementById('filtroBusquedaApellido');
	        myInputApellido.value = '';

	        for (var i = 0; i < filas.length; i++) {
	            var celdaNombre = filas[i].getElementsByTagName('td')[5]; // La quinta celda es la del Dni
	            
              if (celdaNombre) {
                  var textoCelda = celdaNombre.textContent || celdaNombre.innerText;
                  // Compara el texto del filtro con el texto de la celda (ambos en minúsculas)
                  if ((textoCelda.toLowerCase().indexOf(textoFiltro) > -1)) {
                      filas[i].style.display = ""; // Muestra la fila si hay coincidencia
                  } else {
                      filas[i].style.display = "none"; // Oculta la fila si no hay coincidencia
                  }
              }
	        }
	    });

	  //FUNCION PARA LIMPIAR LOS FILTROS APELLIDO Y DNI EN listarSobreturnos.html
	    function limpiarFiltros() {
	        document.getElementById('filtroBusquedaApellido').value = ''; // Limpia el campo de texto
	        // Repite la lógica de filtrado para mostrar todas las filas (textoFiltro vacío)
	        document.getElementById('filtroBusquedaApellido').dispatchEvent(new Event('input'));
	        
	        document.getElementById('filtroBusquedaDni').value = ''; // Limpia el campo de texto
	        // Repite la lógica de filtrado para mostrar todas las filas (textoFiltro vacío)
	        document.getElementById('filtroBusquedaDni').dispatchEvent(new Event('input'));
	    }

	</script>
	</body>
	</html>
