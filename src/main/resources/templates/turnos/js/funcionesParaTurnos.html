	// Convertimos a español los dias de la semana de moment.
	function ObtenerDiaEspañol(date) {
		const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
		return days[moment(date).day()];
	}

		function listarRangoPlanillaDet() {
		    const profId = $("#profesional").val();
		    const EspecId = $("#especialidad").val();
		    const mostrarCancelados = $("#isCheckTurCanceladosMedico").is(":checked");
		
		    if (!profId || !EspecId) return;
		
		 	// Continuamos
		    $.ajax({
		        url: "/api/turnosLibresController/between/" + profId + "/" + EspecId,
		        type: "GET",
		        success: function(data) {
		            $("#turnosLibresTableBody").empty();            
            
            if (data && Array.isArray(data)) {
                data.forEach(function(turno) {
                    // 1. CAPTURA SEGURA DE ESTADO (Si algo es null, asume 3)
                    var estadoId = (turno.estado && turno.estado.id) ? turno.estado.id : 3;
                    var esCancelado = (estadoId === 6);

                    // Filtro de cancelados
                    if (esCancelado && !mostrarCancelados) return;

                    // 2. CAPTURA SEGURA DE FECHA
                    var fechaValida = turno.rangoFechaHora || turno.fechaHora;
                    if (!fechaValida) return; // Si no hay fecha, no podemos dibujar la fila

                    // 3. CAPTURA SEGURA DE IDs
                    // Usamos || "---" para que si es null, no rompa el forEach.
                    var idTurno = turno.id || "---";
                    var idCabecera = (turno.planillacabecera && turno.planillacabecera.id) ? turno.planillacabecera.id : "---";
                    
                    // 4. CAPTURA SEGURA DE BOX
                    var numBox = turno.box || (turno.planilladetalle && turno.planilladetalle.box) || 0;
                    var textoBox = (numBox > 0) ? " <span style='color: MediumSeaGreen; font-weight: bold; margin-left: 10px;'> Box: " + numBox + "</span>" : "";

                    var claseFila = esCancelado ? "class='fila-cancelada'" : "";

                    var row = "<tr " + claseFila + ">" +
                                "<td>" + idTurno + "</td>" +
                                "<td>" + idCabecera + "</td>" +
                                "<td>" + 
                                    ObtenerDiaEspañol(fechaValida).toUpperCase() + '  ' + 
                                    moment(fechaValida).format('DD/MM/YYYY HH:mm') + 
                                    textoBox + 
                                "</td>" +
                              "</tr>";
                    
                    $("#turnosLibresTableBody").append(row);	                            
                });

             // Ocultado de IDs (ESPECÍFICO para la tabla de la IZQUIERDA)
                $("#turnosLibresTodos").find("tbody tr td:nth-child(1), thead th:nth-child(1)").addClass("ocultar-columna");
                $("#turnosLibresTodos").find("tbody tr td:nth-child(2), thead th:nth-child(2)").addClass("ocultar-columna");
            }

            // Llamamos a las demás funciones
            if(typeof listarHorariosAtencion === 'function') listarHorariosAtencion();
            if(typeof obtenerObservaciones === 'function') obtenerObservaciones();
            if(typeof listarTurnosOcupados === 'function') listarTurnosOcupados();
        },
        error: function(error) {
            console.log("Error en la petición:", error);
        }
    });    	                
}

			function obtenerObservaciones() {
			    // 1. REQUISITO: Solo si el médico y especialidad están verificados (Check marcado)
			    if (!$("#isCheckProfEsp").is(":checked")) {
			        //$("#btnObservacionesMedico").hide(); // Ocultamos el botón si no está verificado
			        ocultarPopUpObs();
			        cacheObservacionesMedico = "";
			        return;
			    }

			    const profId = $("#profesional").val();
			    const EspecId = $("#especialidad").val();

			    if (!profId || !EspecId) return;

			    $.ajax({
			        url: "/api/turnosLibresController/obtener-observaciones/" + profId + "/" + EspecId,
			        type: "GET",
			        success: function(data) {
			        	cacheObservacionesMedico = ""; // Reiniciamos el cache

			            // Recorremos la vinculación (objeto Vinculacion)
			            data.forEach(function(Vinculacion) { 
			            	//mostramos las observaciones del profesional en el parrafo.
			            	/* if(Vinculacion.observacion.trim() !== ""){  	                        	 
  	                        	$("#observaciones").html(Vinculacion.observacion);
                    			  }else{
                    				// Si esta vacio, muestra un texto de error en el <p>.
                    				document.getElementById('observaciones').style.textAlign = "center";
    	                    	      $("#observaciones").text("* NO EXISTEN OBSERVACIONES DEL PROFESIONAL *"); 
                    			  } */
			                if (Vinculacion.observacion && Vinculacion.observacion.trim() !== "") {
			                    // //mostramos y Guardamos la observación en el cache global
			                    cacheObservacionesMedico = Vinculacion.observacion;
			                }
			            });

			            // 2. LÓGICA DEL BOTÓN: Si hay observaciones, aparece el botón de binoculares
			            if (cacheObservacionesMedico !== "") {
			                $("#btnObservacionesMedico").fadeIn(); // Efecto suave de aparición
			            } else {
			                $("#btnObservacionesMedico").hide();
			                // Opcional: podrías guardar un mensaje de "No hay observaciones"
			                cacheObservacionesGral = "No existen observaciones específicas para este profesional y especialidad.";
			                // Si quieres que el botón NO aparezca si está vacío, deja el .hide()
			            }
			        },
			        error: function(error) {
			            console.error("Error en la vinculación:", error);
			            $("#btnObservacionesMedico").hide();
			        }
			    });
			}

			  function isEmpty(obj) {
				  for (const prop in obj) {
				    if (Object.hasOwn(obj, prop)) {
				      return false;
				    }
				  }

				  return true;
				}
