<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head th:replace="layout/layout :: head "></head>

<style>

/* BOTÓN GUARDAR ELITE */
.btn-guardar-elite {
	background-color: #10b981; /* Un verde esmeralda más sofisticado */
	color: #ffffff;
	border: none;
	border-radius: 8px;
	height: 45px;
	font-weight: 700;
	font-size: 14px;
	letter-spacing: 1px;
	text-transform: uppercase;
	transition: all 0.3s ease;
	box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 10px;
}

.btn-guardar-elite:hover {
	background-color: #059669;
	/* Verde un poco más oscuro al pasar el mouse */
	transform: translateY(-1px);
	box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
	color: #ffffff;
}

.btn-guardar-elite:active {
	transform: translateY(0);
}

.btn-guardar-elite i {
	font-size: 18px;
}

/* Inmovilidad del sistema */
html, body {
	height: 100vh;
	overflow: hidden;
	background-color: #fcfcfd;
	font-family: 'Inter', system-ui, sans-serif;
}

/* Contenedor principal */
.main-app-viewport {
	height: calc(100vh - 70px);
	display: flex;
	flex-direction: column;
	padding: 15px;
}

/* Estilo "Soldado" para Input Groups Elite */
.input-group-soldado {
	border: 1px solid #e2e8f0;
	border-radius: 8px !important;
	overflow: hidden;
	transition: all 0.2s ease;
	background: white;
}

.input-group-soldado:focus-within {
	border-color: #0052cc;
	box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.1);
}

.input-group-soldado .input-group-text {
	background: transparent !important;
	border: none !important;
	color: #0052cc; /* Azul Elite */
	font-size: 14px;
	padding-right: 5px;
}

.input-group-soldado .form-control, .input-group-soldado .form-select {
	border: none !important;
	box-shadow: none !important;
	font-size: 14px;
	font-weight: 500;
	color: #1a1f36;
	height: 38px;
}

.label-elite {
	font-size: 11px;
	font-weight: 800;
	color: #8792a2;
	text-transform: uppercase;
	margin-bottom: 4px;
	display: block;
	letter-spacing: 0.5px;
}

/* DISEÑO DE BOTONES DE DÍA ELITE (UNIFICADO) */
.day-selector-container input[type="radio"] {
	display: none;
}

.day-btn {
	display: flex;
	align-items: center;
	justify-content: center;
	height: 28px;
	font-size: 10px;
	font-weight: 800;
	color: #64748b;
	border-radius: 4px;
	cursor: pointer;
	transition: all 0.2s ease;
	text-transform: uppercase;
	margin: 0;
	border: 1px solid transparent;
}

.day-btn:hover {
	background-color: #f8f9fa;
}

/* Estado Activo para días comunes (Azul Elite) */
.day-selector-container input[type="radio"]:checked+.day-btn {
	background-color: #0052cc;
	color: #ffffff !important;
	box-shadow: 0 2px 4px rgba(0, 82, 204, 0.2);
}

/* Estado Activo para TODO (Rojo Elite con texto Blanco) */
.day-selector-container input[type="radio"]:checked+.day-btn-todos {
	background-color: #ef4444 !important;
	color: #ffffff !important;
	box-shadow: 0 2px 4px rgba(239, 68, 68, 0.2);
}

.day-btn-todos {
	color: #ef4444; /* Rojo inicial */
}
</style>

<body style="overflow-y: auto; background-color: #f4f7f6;">
	<header th:replace="layout/layout :: header "></header>

	<div class="container-fluid py-1 px-2">
		<!-- min-height ajustado para dar soporte al botón guardar -->
		<div class="card shadow-sm border-0 mb-3"
			style="min-height: 88vh; background: #ffffff;">

			<div class="card-body p-2">
				<!-- CABECERA -->
				<div
					class="d-flex justify-content-between align-items-center border-bottom mb-2 pb-1">
					<h5 th:text="${titulo}" class="text-danger m-0 fw-bold flex-grow-1"
						style="font-size: 16px;"></h5>
					<input
						class="form-control bg-light text-danger text-center fw-bold border-0 px-0 flex-shrink-0 me-3"
						type="text" id="fechaHora" name="fechaHora" readonly
						style="width: 230px; font-size: 14px; height: 25px; box-shadow: none; letter-spacing: 0.5px;">
				</div>

				<form id="myForm" th:action="@{/turnos/formTurno}"
					th:object="${turno}" method="post">
					<input type="hidden" id="profIdPre" th:value="${profIdPre}">
					<input type="hidden" id="especIdPre" th:value="${especIdPre}">

					<!-- BLOQUE SUPERIOR -->
					<div
						class="row g-2 mb-2 bg-light p-2 rounded border mx-0 align-items-center shadow-sm">
						<!-- 1. Médico y Especialidad -->
						<div class="col-md-3 border-end px-3">
							<div class="mb-1">
								<div class="input-group"
									style="height: 30px; border: 1px solid #dee2e6; border-radius: 4px; overflow: hidden;">
									<span class="input-group-text bg-white border-0"
										style="padding-right: 5px;"> <i class="fas fa-user-md"
										style="font-size: 14px; color: #0052cc;"></i>
									</span>

									<!-- Buscador Elite: Sin autocompletado de Chrome y con limpieza al clic 
										 y para volver a dar un turno con mismo profesional -->
									<input type="text" id="profesionalInput"
										class="form-control form-control-sm border-0 shadow-none"
										list="profesionalesList" placeholder="Buscar Médico..."
										th:value="${profesionalSeleccionado != null} ? (${profesionalSeleccionado.codigo} + ' - ' + ${profesionalSeleccionado.apellido} + ' ' + ${profesionalSeleccionado.nombre}) : ''"
										style="font-size: 14px; height: 100%;" autocomplete="off"
										role="presentation" onclick="limpiarBuscadorProfesional(this)"
										oninput="sincronizarProfesional(this)">

									<datalist id="profesionalesList">
										<option th:each="p : ${profesionales}"
											th:value="${p.codigo} + ' - ' + ${p.apellido} + ' ' + ${p.nombre}"
											th:data-id="${p.id}"></option>
									</datalist>

									<!-- Select original OCULTO para mantener tu lógica Spring/JS -->
									<select id="profesional" name="profesional" class="d-none">
										<option value="" disabled selected>Seleccione
											Médico...</option>
										<option th:each="p : ${profesionales}" th:value="${p.id}"
											th:text="${p.codigo} + ' - ' + ${p.apellido} + ' ' + ${p.nombre}"></option>
									</select>
								</div>
							</div>

							<div class="mb-1">
								<div class="input-group">
									<!-- Icono soldado -->
									<span class="input-group-text bg-white"
										style="height: 30px; border-right: none;"> <i
										class="fas fa-stethoscope"
										style="font-size: 14px; color: #0052cc;"></i>
									</span>

									<!-- Tu Select de Especialidad -->
									<select id="especialidad" name="especialidad"
										class="form-select form-select-sm"
										th:onclick="existeEspecialidad()"
										th:onchange="focusPacienteApeyNom();"
										style="font-size: 14px; height: 30px; border-left: none; box-shadow: none;">
									</select>
								</div>
							</div>

						</div>

						<!-- 2. Paciente (Estructurado fijo de fábrica con Botón Vertical) -->
						<div class="col-md-3 px-3 d-flex align-items-center gap-2">
							
							<!-- Contenedor izquierdo independiente: Agrupa tus dos buscadores con la altura justa -->
							<div class="flex-grow-1 d-flex flex-column justify-content-between" style="height: 64px;">
								<!-- Búsqueda por Apellido y Nombre -->
								<div class="input-group" style="height: 30px; border: 1px solid #dee2e6; border-radius: 4px; overflow: hidden;">
									<span class="input-group-text bg-white border-0" style="padding-right: 5px;"> 
										<i class="fas fa-search" style="font-size: 13px; color: #0052cc;"></i>
									</span> 
									<input type="hidden" id="pacienteId" name="pacienteId" /> 
									<input type="text" id="buscar_pacienteApeNom" name="buscar_pacienteApeNom"
										class="form-control form-control-sm border-0 shadow-none" placeholder="Apellido y Nombre"
										style="font-size: 14px; height: 100%;" th:onclick="clearInput()">
								</div>

								<!-- Búsqueda por DNI con borde unificado y nivelado -->
								<div class="input-group" style="height: 30px; border: 1px solid #dee2e6; border-radius: 4px; overflow: hidden;">
									<span class="input-group-text bg-white border-0" style="padding-right: 5px;"> 
										<i class="fas fa-id-card" style="font-size: 13px; color: #0052cc;"></i>
									</span>
									<input type="hidden" id="pacientedniId" name="pacientedniId" />
									<input type="text" id="buscar_pacienteDni" name="buscar_pacienteDni"
										class="form-control form-control-sm border-0 shadow-none" placeholder="Dni / Documento"
										style="font-size: 14px; height: 100%;" th:onclick="clearInput()">
								</div>
							</div>

							<!-- Botón Vertical Esmeralda Nativo: Sin alterar elementos del DOM -->
							<button type="button" id="btnAltaParticularExpress" class="btn btn-sm btn-primary d-flex flex-column align-items-center justify-content-center p-1" 
									style="width: 32px; height: 64px; font-size: 9px; font-weight: 800; border-radius: 4px; letter-spacing: 0.5px; line-height: 1.1; flex-shrink: 0;"
									data-bs-toggle="modal" data-bs-target="#modalAltaParticular" title="Alta Exprés Particular">
								<i class="fas fa-user-plus mb-1" style="font-size: 11px;"></i>
								<span>A</span><span>L</span><span>T</span><span>A</span>
							</button>

							<!-- Línea divisoria vertical restituida de forma física aislada -->
							<div id="lineaDivisoriaParticular" style="width: 1px; height: 75px; background-color: #dee2e6; flex-shrink: 0;" class="ms-1"></div>
						</div>



						<!-- 3. Observaciones y Botones -->
						<div class="col-md-4 px-3">
							<div class="mb-1">
								<div class="input-group">
									<!-- Icono soldado de nota médica -->
									<span class="input-group-text bg-white"
										style="height: 30px; border-right: none;"> <i
										class="fas fa-comment-medical"
										style="font-size: 14px; color: #0052cc;"></i>
									</span>

									<!-- Tu Input de Observación -->
									<input type="text" id="Observacion" name="Observacion"
										maxlength="68"
										class="form-control form-control-sm text-uppercase"
										th:field="*{Observacion}"
										placeholder="OBSERVACIÓN DEL TURNO..."
										style="font-size: 12px; height: 30px; border-left: none; box-shadow: none;"
										autocomplete="off" />
								</div>
							</div>


							<div class="d-flex gap-2 mt-1">
								<!-- BOTÓN DETALLES (Verde Clínico / Esmeralda) -->
								<button type="button" id="btnObservacionesMedico"
									class="btn btn-outline-info d-flex align-items-center justify-content-center flex-fill"
									style="height: 28px; font-size: 10px; font-weight: 700; color: #0891b2; border-color: #0891b2; letter-spacing: 0.5px; border-radius: 4px;"
									onmouseover="mostrarPopUpObs(this)"
									onmouseout="ocultarPopUpObs()">
									<i class="fa-solid fa-address-card me-2"></i> <span>DETALLES
										MÉDICO</span>
								</button>

								<!-- BOTÓN BUSCADOR (Mismo estilo con Lupa) -->
								<a th:href="@{/turnos/listarTurno}"
									class="btn btn-outline-info d-flex align-items-center justify-content-center flex-fill text-decoration-none"
									style="height: 28px; font-size: 10px; font-weight: 700; color: #0891b2; border-color: #0891b2; letter-spacing: 0.5px; border-radius: 4px;">
									<i class="fa-solid fa-magnifying-glass me-2"></i> <span>BUSCAR
										TURNOS</span>
								</a>
							</div>

						</div>

						<!-- 4. Foto -->
						<div class="col-md-2 d-flex justify-content-center border-start">
							<div
								style="width: 75px; height: 75px; border: 2px solid #17a2b8; border-radius: 50%; overflow: hidden; background: #e9ecef; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);">
								<img id="fotoMedico"
									style="width: 100%; height: 100%; object-fit: cover; display: none;">
								<div id="fotoDefault"
									class="d-flex align-items-center justify-content-center h-100">
									<i class="fa fa-user-md text-secondary"
										style="font-size: 30px;"></i>
								</div>
							</div>
						</div>
					</div>

					<!-- TABLAS PARALELAS -->
					<div class="row g-2">
						<!-- PANEL IZQUIERDO -->
						<div class="col-md-3">
							<h6 class="text-success fw-bold small mb-1">HORARIOS
								SEMANALES</h6>
							<div class="card border shadow-none mb-1" style="height: 120px;">
								<div class="table-responsive" style="height: 100%;">
									<table class="table table-sm table-hover mb-0"
										id="horariosAtencion">
										<thead class="table-primary sticky-top">
											<tr style="font-size: 12px;">
												<th>DIA</th>
												<th>HORARIOS</th>
											</tr>
										</thead>
										<tbody id="horariosAtencionTableBody" style="font-size: 14px;"></tbody>
									</table>
								</div>
							</div>

							<!-- SELECTOR DE DÍAS ELITE - FORM TURNO -->
							<div
								class="day-selector-container d-flex justify-content-between align-items-center mb-2 p-1 border rounded bg-white shadow-sm"
								style="height: 38px; border-color: #e2e8f0 !important;">

								<div class="d-flex w-100 justify-content-between">
									<div class="flex-fill px-1">
										<input type="radio" name="dia" value="lunes" id="radioLunes">
										<label class="day-btn" for="radioLunes">LUN</label>
									</div>
									<div class="flex-fill px-1">
										<input type="radio" name="dia" value="martes" id="radioMartes">
										<label class="day-btn" for="radioMartes">MAR</label>
									</div>
									<div class="flex-fill px-1">
										<input type="radio" name="dia" value="miercoles"
											id="radioMiercoles"> <label class="day-btn"
											for="radioMiercoles">MIÉ</label>
									</div>
									<div class="flex-fill px-1">
										<input type="radio" name="dia" value="jueves" id="radioJueves">
										<label class="day-btn" for="radioJueves">JUE</label>
									</div>
									<div class="flex-fill px-1">
										<input type="radio" name="dia" value="viernes"
											id="radioViernes"> <label class="day-btn"
											for="radioViernes">VIE</label>
									</div>
									<div class="flex-fill px-1">
										<input type="radio" name="dia" value="sabado" id="radioSabado">
										<label class="day-btn" for="radioSabado">SÁB</label>
									</div>
									<div class="flex-fill px-1 border-end me-1">
										<input type="radio" name="dia" value="domingo"
											id="radioDomingo"> <label class="day-btn"
											for="radioDomingo">DOM</label>
									</div>

									<!-- Opción TODO activa por defecto -->
									<div class="flex-fill ps-1">
										<input type="radio" name="dia" value="todos" id="radioTodos"
											checked> <label class="day-btn day-btn-todos"
											for="radioTodos">TODOS</label>
									</div>
								</div>
							</div>


							<!-- TABLA LIBRES (Ajustada 0,5 cm menos que el original) -->
							<div class="card border shadow-none" style="height: 240px;">
								<input type="hidden" id="planillaDetId" name="planillaDetId" />
								<input type="hidden" id="planillaCabId" name="planillaCabId" />
								<input type="hidden" id="rangoFechaHora" name="rangoFechaHora" />
								<div class="table-responsive" style="height: 100%;">
									<table class="table table-sm table-hover mb-0"
										id="turnosLibresTodos">
										<thead class="table-primary sticky-top">
											<tr style="font-size: 12px;">
												<th>PD</th>
												<th>PC</th>
												<th>TURNOS DISPONIBLES</th>
											</tr>
										</thead>
										<tbody id="turnosLibresTableBody" style="font-size: 14px;"></tbody>
									</table>
								</div>
							</div>

							<!-- PANEL DE CONTROL ELITE CON COLOR EXACTO DE TABLE-PRIMARY -->
							<div
								class="d-flex align-items-center justify-content-center shadow-sm mt-2 w-100"
								style="height: 45px; background-color: #cfe2ff; border: 1px solid #b6d4fe; border-radius: 6px; padding: 0 15px; gap: 25px;">

								<!-- Opción 1: Cancelados -->
								<div
									class="form-check form-switch m-0 p-0 d-flex align-items-center"
									style="white-space: nowrap;">
									<input class="form-check-input m-0" type="checkbox"
										role="switch" id="isCheckTurCanceladosMedico" value="true"
										style="width: 28px; height: 14px; cursor: pointer; float: none; border-color: #084298;">
									<label class="fw-bold ms-2 mb-0"
										for="isCheckTurCanceladosMedico"
										style="cursor: pointer; font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase; color: #084298;">
										Planillas Canceladas </label>
								</div>

								<!-- Divisor vertical que combina con el borde de la tabla -->
								<div
									style="width: 1px; height: 18px; background-color: #b6d4fe;"></div>

								<!-- Opción 2: Sobreturnos -->
								<div
									class="form-check form-switch m-0 p-0 d-flex align-items-center"
									style="white-space: nowrap;">
									<input class="form-check-input m-0" type="checkbox"
										role="switch" id="isCheckSobreturnos"
										name="isCheckSobreturnos" value="true"
										style="width: 28px; height: 14px; cursor: pointer; float: none; border-color: #084298;">
									<label class="fw-bold ms-2 mb-0" for="isCheckSobreturnos"
										style="cursor: pointer; font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase; color: #084298;">
										Sobreturnos </label>
								</div>
							</div>


						</div>

						<!-- PANEL DERECHO: TABLA OCUPADOS (Ajustada 0,5 cm menos que el original) -->
						<div class="col-md-9">
							<h6 class="text-success fw-bold small mb-1">TURNOS OCUPADOS</h6>
							<div class="card border shadow-none">
								<div class="table-responsive"
									style="height: 409px; overflow-y: auto;">
									<table class="table table-sm table-hover mb-0"
										id="turnosOcupadosTodos">
										<thead class="table-primary sticky-top">
											<tr style="font-size: 11px;">
												<th>TID</th>
												<th>PACID</th>
												<th>PCID</th>
												<th>PDID</th>
												<th>NOMBRE DEL PACIENTE</th>
												<th>FECHA Y HORA</th>
												<th>BOX</th>
												<th>TIPO</th>
												<th>DETALLE</th>
											</tr>
										</thead>
										<tbody id="turnosOcupadosTableBody" style="font-size: 15px;"></tbody>
									</table>
								</div>
							</div>

							<div class="mt-2">
								<button type="submit" class="btn btn-guardar-elite w-100"
									id="btnConfirmar" th:onmouseover="existePlanillaActiva()">
									<i class="fa-solid fa-circle-check"></i> <span>Confirmar
										y Guardar Registro</span>
								</button>
							</div>

						</div>
					</div>

					<input class="form-check-input d-none" type="checkbox"
						id="isCheckProfEsp" value="true" disabled> <input
						class="form-check-input d-none" type="checkbox"
						id="isCheckPaciente" value="true" disabled> <input
						class="form-check-input d-none" type="checkbox"
						id="isCheckTurnoSeleccionado" value="true" disabled>
					<button class="d-none" type="button" id="btnMostrar"
						th:onclick="listarRangoPlanillaDet()"></button>
				</form>
			</div>
		</div>
	</div>

	<div id="popupObservacionesFull"
		style="display: none; position: fixed; z-index: 10000; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border: 3px solid #17a2b8; border-radius: 8px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.5); width: 792px; height: 370px; pointer-events: none;">
		<div
			style="background: #17a2b8; color: white; padding: 10px; font-weight: bold; text-align: center; border-radius: 5px 5px 0 0;">
			REGLAS Y PROCEDIMIENTOS DEL PROFESIONAL</div>
		<div id="cuerpoPopUpFull"
			style="padding: 20px; font-size: 15px; color: #333; line-height: 1.6; overflow-y: auto; height: 310px; white-space: pre-wrap;"></div>
	</div>

	<footer th:replace="~{layout/layout :: footer}"></footer>
	<script
		th:replace="turnos/js/load-combobox-vinculacion-turnos :: javascript"></script>
	<script th:replace="turnos/js/autocomplete-pacientes :: javascript"></script>
	<script th:replace="turnos/js/funcionesParaTurnos :: javascript"></script>
	<script>
		document
				.getElementById("myForm")
				.addEventListener(
						"submit",
						function(event) {
							// Validaciones básicas
							//const isCheckPaciente = document.getElementById("isCheckPaciente").value;
							if (document.getElementById('isCheckPaciente').checked === false
									|| document
											.getElementById('isCheckProfEsp').checked === false) {
								//mostramos una Alerta personalizada.
								Swal
										.fire({
											icon : "error",
											title : "Lo sentimos.. Algo Salió mal..",
											html : "Datos Incompletos.<br>Verifique todos los campos por favor...",
										//imageUrl : "/images/thumbs-down.jpg"
										});
								event.preventDefault(); // Detiene el envío
								return;
							}
							if (document
									.getElementById('isCheckTurnoSeleccionado').checked === false) {
								//mostramos una Alerta personalizada.
								Swal
										.fire({
											icon : "error",
											title : "Lo sentimos.. Algo Salió mal..",
											html : "Datos Incompletos.<br>Seleccione un Horario por favor...",
										//imageUrl : "/images/thumbs-down.jpg"

		function sincronizarProfesional(input) {
		    const val = input.value;
		    const options = document.querySelectorAll('#profesionalesList option');
		    const realSelect = document.getElementById('profesional');
		    
		    for (let opt of options) {
		        if (opt.value === val) {
		            // 1. Sincronizamos el valor
		            realSelect.value = opt.getAttribute('data-id');
		            
		            // 2. DISPARAMOS EL EVENTO 'CHANGE' MANUALMENTE
		            // Esto es vital para que tus funciones de Spring/JS detecten el cambio
		            realSelect.dispatchEvent(new Event('change'));

		            // 3. Ejecutamos tu función de carga específica
		            if (typeof cargarEspecialidades === "function") {
		                cargarEspecialidades();
		            }
		            
		            input.blur(); // Cerramos el desplegable
		            break;
		        }
		    }
		}

		function limpiarBuscadorProfesional(input) {
		    // 1. Limpia el texto visual
		    input.value = '';
		    
		    // 2. Resetea el select oculto
		    const realSelect = document.getElementById('profesional');
		    if (realSelect) realSelect.value = "";
		    
		    // 3. Limpia el combo de especialidades y la foto si existen
		    const especSelect = document.getElementById('especialidad');
		    if (especSelect) especSelect.innerHTML = ""; 
		    
		    const fotoMedico = document.getElementById('fotoMedico');
		    if (fotoMedico) fotoMedico.style.display = 'none';
		    
		    const fotoDefault = document.getElementById('fotoDefault');
		    if (fotoDefault) fotoDefault.style.display = 'flex';

		    // 4. Resetea flags de validación si los usas
		    const checkProf = document.getElementById('isCheckProfEsp');
		    if (checkProf) checkProf.checked = false;
		}

		//BOTON ALTA EXPRESS UNIFICADO CON ICONOS SOLDADOS ELITE
		$(document).ready(function() {
	    // 1. INYECTAMOS EL MODAL CON INPUTS ELITE SOLDADOS (FONT AWESOME INTEGRADO) TOTALMENTE AFUERA DEL FORM

	                  <span class="input-group-text bg-white border-0" style="padding-right: 5px;"><i class="fas fa-user" style="font-size: 13px; color: #0052cc;"></i></span>
	                  <input type="text" class="form-control form-control-sm border-0 shadow-none" id="partApellido" required style="font-size: 13px; height: 100%; text-transform: uppercase;" />
	                </div>
	              </div>
	
	              <!-- Campo Nombre -->
	              <div class="mb-2">
	                <label class="form-label mb-0 fw-bold text-muted" style="font-size: 11px;">Nombre</label>
	                <div class="input-group" style="height: 30px; border: 1px solid #dee2e6; border-radius: 4px; overflow: hidden; background: white;">
	                  <span class="input-group-text bg-white border-0" style="padding-right: 5px;"><i class="fas fa-signature" style="font-size: 13px; color: #0052cc;"></i></span>
	                  <input type="text" class="form-control form-control-sm border-0 shadow-none" id="partNombre" required style="font-size: 13px; height: 100%; text-transform: uppercase;" />

	              <div class="mb-2">
	                <label class="form-label mb-0 fw-bold text-muted" style="font-size: 11px;">Email (Comprobantes)</label>
	                <div class="input-group" style="height: 30px; border: 1px solid #dee2e6; border-radius: 4px; overflow: hidden; background: white;">

	    if ($("#modalAltaParticular").length === 0) {

	    // 2. ESCUCHADOR DEL ENVÍO EXPRESS POR AJAX CON CABECERA CSRF ANTIBLOQUEO
	    $(document).off("submit", "#formAltaParticularExpres").on("submit", "#formAltaParticularExpres", function(e) {
	        e.preventDefault();
	
	        const datos = {
	            dni: $("#partDni").val(),
	            apellido: $("#partApellido").val(),
	            nombre: $("#partNombre").val(),
	            email: $("#partEmail").val()
	        };
	
	        // CAPTURA AUTOMÁTICA DEL TOKEN DE SEGURIDAD CSRF DE SPRING SECURITY
	        const tokenCsrf = $("input[name='_csrf']").val() || $("meta[name='_csrf']").attr("content");
	        const headerCsrf = $("meta[name='_csrf_header']").attr("content") || "X-CSRF-TOKEN";
	
	        $.ajax({
	            url: "/turnos/formPacienteExpress", // Endpoint unificado real de turnos
	            method: "POST",
	            data: datos,
	            beforeSend: function(xhr) {
	                // INYECCIÓN MÁGICA: Desactiva el bloqueo de Spring Security
	                if (tokenCsrf) {
	                    xhr.setRequestHeader(headerCsrf, tokenCsrf);
	                }
	            },
	            success: function(res) {
	                let json = typeof res === "string" ? JSON.parse(res) : res;
	                if (json.status === "success") {
	                    // Llenamos tus inputs hidden originales de la pantalla principal
	                    $("#pacienteId").val(json.id);
	                    $("#pacientedniId").val(json.id);
	                    
	                    // Colocamos el texto visual en tus buscadores
	                    $("#buscar_pacienteApeNom").val(datos.apellido.toUpperCase() + " " + datos.nombre.toUpperCase());
	                    $("#buscar_pacienteDni").val(datos.dni);
	
	                    // Encendemos tus validaciones de checkbox ocultas de Thymeleaf
	                    let checkPac = document.getElementById('isCheckPaciente');
	                    if(checkPac) {
	                        checkPac.checked = true;
	                    }
	
	                    // --- LIMPIEZA PROFUNDA DE MODAL BOOTSTRAP (Destraba los clics del switch) ---
	                    $("#modalAltaParticular").modal("hide"); 
	                    $(".modal-backdrop").remove();          
	                    $("body").removeClass("modal-open");     
	                    $("body").css("overflow", "auto");       
	                    
	                    document.getElementById("formAltaParticularExpres").reset();
	                    // -----------------------------------------------------------------
	
	                    // Cartel de éxito rápido sin bloquear la pantalla
	                    Swal.fire({
	                        title: "¡Paciente Creado!",
	                        text: "Ya quedó seleccionado de forma automática. Continuá con la carga del turno.",
	                        icon: "success",
	                        timer: 2000,
	                        showConfirmButton: false
	                    });
	                }
	            },
	            error: function(xhr) {
	                if (xhr.status === 409) {
	                    Swal.fire("Atención", "Este DNI ya corresponde a un paciente registrado.", "warning");
	                } else {
	                    Swal.fire("Error", "No se pudo registrar el paciente en el servidor.", "error");
	                }
	            }
	        });
	    });
	});


	</script>
