<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
	<script type="text/javascript" th:fragment="javascript"> 
	
	// 1. VINCULACIÓN MÉDICO-ESPECIALIDAD
    function cargarEspecialidadesAudit() {
        var profesionalId = $("#profesionalAudit").val();
        var profesionalNombre = $('#profesionalAudit option:selected').text(); 
        var $especialidad = $("#especialidadAudit");

        $especialidad.empty()
                     .append('<option value="" selected disabled>Cargando...</option>')
                     .prop("disabled", true);

        if (profesionalId) {
            $.ajax({
                type: 'GET',
                url: "/turnos/cargar-especialidades/" + profesionalId,
                dataType: 'json',
                success: function(lista) {
                    if (!lista || lista.length === 0) {
                        $especialidad.empty().append('<option value="" selected disabled>Sin Vinculación</option>');
                        Swal.fire({
                            icon: "error",
                            title: "Lo sentimos.. Algo Salió mal..",
                            text: "No existen especialidades vinculadas para el profesional: " + profesionalNombre.toUpperCase(),
                            confirmButtonColor: '#d33'
                        });
                    } else {
                        $especialidad.empty().prop("disabled", false);
                        $especialidad.append('<option value="" selected disabled>Seleccione Especialidad...</option>');
                        $.each(lista, function(index, e) {
                            $especialidad.append(new Option(e.especialidadNombre, e.id));
                        });
                    }
                },
                error: function(xhr) {
                    Swal.fire({
                        icon: "error",
                        title: "Error de Comunicación",
                        text: "No se pudo consultar las vinculaciones del profesional."
                    });
                }
            });
        } else {
            $especialidad.empty().append('<option value="" selected disabled>Especialidad...</option>').prop("disabled", true);
        }
    }

    // 2. BÚSQUEDA
    function buscarCancelados() {
        const tipo = document.querySelector('input[name="tipoRegistro"]:checked').value;
        const profId = $("#profesionalAudit").val();
        const especId = $("#especialidadAudit").val();
        const desde = $("#fechaDesde").val();
        const hasta = $("#fechaHasta").val();

        if (!profId || !especId) {
            Swal.fire('Campos Incompletos', 'Seleccione Profesional y Especialidad', 'info');
            return;
        }

        $("#contenedorResultados").html('<div class="text-center p-5"><div class="spinner-border text-primary"></div></div>');

        $.get("/auditoria/buscar", { tipo: tipo, profId: profId, especId: especId, desde: desde, hasta: hasta }, 
            function(fragmento) {
                $("#contenedorResultados").hide().html(fragmento).fadeIn(300);
            }
        );
    }
    
    // 3. RESTAURACIÓN INDIVIDUAL
    function restaurarTurno(id){
    	ejecutarAjaxRestaurar("/auditoria/restaurar-turno", id, "Turno"); 
    }
    
    function restaurarSobreturno(id){
    	ejecutarAjaxRestaurar("/auditoria/restaurar-sobreturno", id, "Sobreturno"); 
    }
    
    // 4. RESTAURACIÓN MASIVA (Integrando tu pedido)
    function restaurarPlanilla() { 
        confirmarRestauracionMasiva();
    }

    function confirmarRestauracionMasiva() {
        const profId = $("#profesionalAudit").val();
        const especId = $("#especialidadAudit").val();
        const desde = $("#fechaDesde").val();
        const hasta = $("#fechaHasta").val();

        ejecutarAjaxRestaurar("/auditoria/restaurar-planilla", {
            profId: profId, 
            especId: especId, 
            desde: desde, 
            hasta: hasta
        }, "Planilla Completa");
    }

    function ejecutarAjaxRestaurar(url, dataObj, titulo) {
        Swal.fire({
            title: '¿Restaurar ' + titulo + '?',
            text: 'Se reactivarán los registros y se realizará backup preventivo.',
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#0891b2', // COLOR CIAN MÉDICO
            cancelButtonColor: '#64748b',  // GRIS PROFESIONAL
            confirmButtonText: 'Sí, restaurar',
            cancelButtonText: 'Cancelar'
        }).then((result) => {
            if (result.isConfirmed) {
                const token = $("meta[name='_csrf']").attr("content");
                const header = $("meta[name='_csrf_header']").attr("content");
                const finalData = (typeof dataObj === 'object') ? dataObj : { id: dataObj };

                // Loading con spinner cian
                Swal.fire({
                    title: 'Procesando...',
                    didOpen: () => { Swal.showLoading(); },
                    allowOutsideClick: false
                });

                $.ajax({
                    url: url, type: "POST", data: finalData,
                    beforeSend: function(xhr) { if (header && token) xhr.setRequestHeader(header, token); },
                    success: function(res) {
                        if (res === "OK") {
                            // Cartel de éxito también en cian
                            Swal.fire({
                                title: '¡Éxito!',
                                text: 'Restauración completada correctamente.',
                                icon: 'success',
                                confirmButtonColor: '#0891b2'
                            });
                            buscarCancelados(); // Refrescar tabla
                        } else { 
                            Swal.fire('Error', res, 'error'); 
                        }
                    },
                    error: function() {
                        Swal.fire('Error', 'No se pudo conectar con el servidor.', 'error');
                    }
                });
            }
        });
    }

    
    // 5. LIMPIEZA DE RESULTADOS
    function limpiarResultados() {
        const contenedor = document.getElementById('contenedorResultados');
        if(contenedor) {
            contenedor.innerHTML = `
                <div class="d-flex flex-column align-items-center justify-content-center h-100 p-5 text-muted">
                    <i class="fa-solid fa-microscope fa-4x mb-3 opacity-25" style="color: var(--med-cyan);"></i>
                    <h5 class="fw-bold mb-1">Sistema Clínico de Integridad</h5>
                    <p class="small">Filtre por profesional para recuperar registros de agenda</p>
                </div>
            `;
        }
    }
    
    // 6. ACCESO RAPIDO A AUDITORIA
    document.addEventListener("DOMContentLoaded", function() {
        const container = document.getElementById('recuperacionContainer');
        if(!container) return;

        const tipoPre = container.getAttribute('data-tipo-pre');
        const profPre = container.getAttribute('data-prof-pre');
        const especPre = container.getAttribute('data-espec-pre');
        
        if (profPre && profPre !== 'null') {
            document.getElementById('profesionalAudit').value = profPre;
            if (tipoPre) {
                const radio = document.querySelector(`input[name="tipoRegistro"][value="${tipoPre}"]`);
                if (radio) radio.checked = true;
            }
            cargarEspecialidadesAudit(); 
            
            let checkExist = setInterval(function() {
                let especSelect = document.getElementById('especialidadAudit');
                if (especSelect && especSelect.options.length > 1) {
                    especSelect.value = especPre;
                    buscarCancelados();
                    clearInterval(checkExist);
                }
            }, 100);
        }
    });
    
    //MANEJAMOS EL DESPLIEGUE DEL COMBO PROFESIONAL HACIA ABAJO
    document.addEventListener('DOMContentLoaded', function() {
    const selectMedico = document.getElementById('profesionalAudit');
    
    if (selectMedico) {
        selectMedico.addEventListener('mousedown', function() {
            // Truco: le damos un tamaño temporal gigante a la tabla 
            // para que el navegador "vea" espacio infinito abajo
            document.getElementById('contenedorResultados').style.minHeight = "800px";
        });

        selectMedico.addEventListener('blur', function() {
            // Cuando cerrás el combo, volvemos a la altura normal
            setTimeout(() => {
                document.getElementById('contenedorResultados').style.minHeight = "450px";
            }, 200);
        });
    }
});
    
  //MOSTRAMOS EL DETALLE DE LO QUE SE VA A RESTAURAR (icono de ojo)
  function verInformeRecorte(planillaId) {
    Swal.fire({
        title: 'Consultando registros...',
        didOpen: () => { Swal.showLoading(); },
        allowOutsideClick: false
    });

    $.get("/auditoria/detalle-recorte/" + planillaId, function(listaHtml) {
        if (listaHtml.length === 0) {
            Swal.fire('Atención', 'No se encontraron huecos horarios cancelados.', 'info');
            return;
        }

        let contenido = `
            <div style="text-align: left; max-height: 350px; overflow-y: auto; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc;">
                <p class="small text-muted mb-3"><i class="fa-solid fa-circle-info text-info me-1"></i> Los siguientes turnos se encuentran <b>(Cancelados)</b> y volverán a estar disponibles al restaurar:</p>
                <ul style="font-size: 0.85rem; list-style: none; padding-left: 0;">
                    ${listaHtml.join('')}
                </ul>
            </div>`;

        Swal.fire({
            title: '<span style="color: #0891b2; font-size: 1.4rem;"><i class="fa-solid fa-notes-medical me-2"></i>Informe Detallado</span>',
            html: contenido,
            showConfirmButton: true, // Botón para cerrar
            confirmButtonColor: '#64748b', // Color gris para que no parezca una acción de ejecución
            confirmButtonText: 'Entendido',
            width: '500px'
        });
    });
}
  
//llenamos fechaFinal a partir de fechaInicio
	const f1 = document.getElementById('fechaDesde');
	const f2 = document.getElementById('fechaHasta');
	if (f1 && f2) {
		f1.addEventListener('input', function() {
			f2.value = this.value;
		});
	}
	</script>
</body>
</html>
