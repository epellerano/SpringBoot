<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" xmlns:sec="http://thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/layout :: head}">
    <!-- Font Awesome 7 Local -->
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
</head>
<style>
    /* --- ESTÉTICA SIGAT PREMIUM (UNIFICADA) --- */
    .header-sigat-modern {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 20px;
        margin-bottom: 30px;
        border-bottom: 1px solid #e2e8f0;
        position: relative;
    }

    .header-sigat-modern::after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: 0;
        width: 150px;
        height: 3px;
        background-color: #0d6efd;
        border-radius: 2px;
    }

    .icon-shape {
        width: 50px;
        height: 50px;
        background-color: #eef2ff;
        color: #0d6efd;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        font-size: 1.5rem;
    }

    .system-tag {
        font-size: 0.65rem;
        font-weight: 800;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        display: block;
        margin-bottom: -2px;
    }

    .title-main {
        font-family: 'Segoe UI', Arial, sans-serif;
        font-weight: 700;
        color: #1e293b;
        font-size: 1.75rem;
        margin: 0;
    }

    .subtitle-main {
        font-size: 0.85rem;
        color: #94a3b8;
        font-weight: 500;
    }

    /* --- ESTILOS DE TABLA PREMIUM --- */
    .table thead th {
        background-color: #f8fafc;
        color: #475569;
        text-transform: uppercase;
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.5px;
        padding: 15px 10px;
        border-top: none;
    }

    .img-avatar {
        width: 40px;
        height: 40px;
        object-fit: cover;
        border-radius: 50%;
        border: 2px solid #e2e8f0;
    }

    .badge-clinico {
        background-color: #d1fae5;
        color: #065f46;
        border: 1px solid #10b981;
        padding: 0.4em 0.8em;
        font-weight: 700;
        text-transform: uppercase;
        border-radius: 4px;
        font-size: 0.75rem;
    }

    /* Badge dinámico para Estado */
    .badge-status-activo { background-color: #dcfce7; color: #166534; border: 1px solid #22c55e; padding: 0.4em 0.8em; border-radius: 4px; font-weight: 700; font-size: 0.7rem; }
    .badge-status-inactivo { background-color: #fee2e2; color: #991b1b; border: 1px solid #ef4444; padding: 0.4em 0.8em; border-radius: 4px; font-weight: 700; font-size: 0.7rem; }

    /* Botones de acción estilo minimalista */
    .btn-action-link {
        color: #64748b;
        transition: all 0.2s;
    }
    .btn-action-link:hover { color: #0d6efd; }
    .btn-delete-link:hover { color: #dc3545; }
</style>

<body class="bg-light">

    <header th:replace="~{layout/layout :: header}"></header>

    <div class="container-fluid px-lg-5 py-4">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-lg-5">

                <!-- CABECERA PREMIUM REDISEÑADA -->
                <div class="header-sigat-modern">
                    <div class="d-flex align-items-center">
                        <div class="icon-shape me-3 shadow-sm">
                            <i class="fa-solid fa-hospital-user"></i>
                        </div>
                        <div>
                            <!-- <span class="system-tag">SIGAT • GESTIÓN DE PACIENTES</span> -->
                            <h2 class="title-main" th:text="${titulo}"></h2>
                            <span class="subtitle-main">SIGAT • Base de datos central de pacientes</span>
                        </div>
                    </div>
                    
                    <a sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/pacientes/formPaciente}" 
                       class="btn btn-primary fw-bold shadow-sm px-4 py-2 rounded-3">
                        <i class="fa-solid fa-plus-circle me-2"></i>NUEVO PACIENTE
                    </a>
                </div>

                <!-- TABLA RESPONSIVE -->
                <div class="table-responsive mt-3">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th class="text-center">Foto</th>
                                <th class="text-center" sec:authorize="hasRole('ROLE_USER')">Ver</th>
                                <th>Apellido</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                                <th>Nº Socio</th>
                                <th>DNI</th>
                                <th>Fecha Nac.</th>
                                <th class="text-center">Estado</th>
                                <th class="text-center" sec:authorize="hasRole('ROLE_ADMIN')">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="paciente: ${pacientes}">
                                <!-- Foto -->
                                <td class="text-center">
                                    <img th:if="${paciente.foto != null && #strings.length(paciente.foto) > 0}" 
                                         th:src="@{/uploads/{path}(path=${paciente.foto})}" 
                                         class="img-avatar shadow-sm" />
                                    <div th:unless="${paciente.foto != null && #strings.length(paciente.foto) > 0}" 
                                         class="img-avatar bg-light d-flex align-items-center justify-content-center text-muted mx-auto">
                                        <i class="fa-solid fa-user-injured"></i>
                                    </div>
                                </td>

                                <!-- Ver Detalle -->
                                <td class="text-center" sec:authorize="hasRole('ROLE_USER')">
                                    <a th:href="@{/pacientes/verPaciente/} + ${paciente.id}" class="btn-action-link">
                                        <i class="fa-solid fa-circle-info fa-lg"></i>
                                    </a>
                                </td>

                                <td th:text="${paciente.apellido}" class="fw-bold text-dark"></td>
                                <td th:text="${paciente.nombre}"></td>
                                <td th:text="${paciente.email}" class="small text-muted"></td>
                                <td th:text="${paciente.telefono}"></td>
                                
                                <!-- Nº Socio -->
                                <td><span class="badge badge-clinico" th:text="${paciente.numeroSocio}"></span></td>
                                
                                <!-- DNI -->
                                <td><span class="badge badge-clinico" th:text="${paciente.dni}"></span></td>
                                
                                <td th:text="${#dates.format(paciente.createAt,'dd/MM/yyyy')}"></td>
                                
                                <!-- Estado Dinámico -->
                                <td class="text-center">
                                    <span class="badge" 
                                          th:classappend="${paciente.estado == 'Activo' ? 'badge-status-activo' : 'badge-status-inactivo'}"
                                          th:text="${paciente.estado}"></span>
                                </td>

                                <!-- Acciones Admin -->
                                <td class="text-center" sec:authorize="hasRole('ROLE_ADMIN')">
                                    <div class="d-flex justify-content-center gap-3">
                                        <a th:href="@{/pacientes/formPaciente/} + ${paciente.id}" class="btn-action-link" title="Editar">
                                            <i class="fa-solid fa-pen-to-square fa-lg"></i>
                                        </a>
                                        <a th:href="@{/pacientes/eliminarPaciente/} + ${paciente.id}" 
                                           class="btn-action-link btn-delete-link" 
                                           th:onclick="return confirm('¿Está seguro que desea eliminar este paciente?');" title="Eliminar">
                                            <i class="fa-solid fa-trash-can fa-lg"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- PAGINADOR -->
                <div class="d-flex justify-content-between align-items-center mt-4">
                    <p class="small text-muted mb-0">Registros de pacientes bajo normativa SIGAT</p>
                    <nav th:replace="~{paginator-nav :: paginator}"></nav>
                </div>

            </div>
        </div>
    </div>

    <footer th:replace="~{layout/layout :: footer}"></footer>
</body>
</html>
