<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head th:replace="layout/layout :: head ">
<link rel="stylesheet" href="https://cloudflare.com">
</head>
<style>
/* AJUSTE DE ALTURA: 1CM MENOS QUE EL ORIGINAL */
.viewport-container {
	min-height: calc(100vh - 115px);
	display: flex;
	align-items: center;
	justify-content: center;
	padding-top: 0.8rem; /* Reducido para subir el formulario */
	padding-bottom: 0.8rem;
}

.header-clinica {
	border-bottom: 2px solid #dee2e6;
	position: relative;
	padding-bottom: 12px; /* Reducido levemente */
	margin-bottom: 22px; /* Reducido para ganar altura */
}

.header-clinica::after {
	content: "";
	position: absolute;
	bottom: -2px;
	left: 0;
	width: 100px;
	height: 4px;
	background-color: #198754;
	border-radius: 2px;
}

.border-dashed {
	border: 2px dashed #cbd5e0 !important;
	padding: 1rem !important; /* Más compacto */
}

/* MANTENEMOS TAMAÑO DE INPUTS PROFESIONAL */
.form-control, .form-select {
	padding: 0.6rem 0.75rem;
	border: 1px solid #ced4da;
}

.input-group-text {
	background-color: #f8f9fa;
	color: #495057;
	border: 1px solid #ced4da;
	border-right: none;
}
</style>
<body class="bg-light">

	<header th:replace="layout/layout :: header "></header>

	<div class="container viewport-container">
		<div class="row justify-content-center w-100 m-0">
			<div class="col-12 col-lg-11 col-xl-10">
			<!-- <div class="col-12 col-lg-12 col-xl-12"> -->

				<div class="card shadow-lg border-0 rounded-3">
					<div class="card-body px-lg-5 py-3">
						<!-- Padding balanceado -->
						<!-- TÍTULO Y ICONO DE PACIENTES -->
						<div class="header-clinica d-flex align-items-center">
							<!-- Contenedor con fondo suave (usamos un tono verde o azul para salud) -->
							<div
								class="d-flex align-items-center justify-content-center rounded-3 me-3"
								style="width: 75px; height: 75px; background-color: #e8f5e9;">
								<!-- Un verde muy suave para pacientes -->

								<!-- Icono de Paciente relleno -->
								<i class="bi bi-person-plus-fill"
									style="font-size: 2.8rem; color: #2e7d32;"></i>
								<!-- Verde médico profesional -->
							</div>

							<div>
								<h3 th:text="${titulo}" class="fw-bold text-dark mb-0"></h3>
								<p class="text-muted mb-0 text-uppercase small"
									style="letter-spacing: 1px; font-size: 0.75rem; font-weight: 600;">
									SIGAT • Gestión de Pacientes</p>
							</div>
						</div>


						<form th:action="@{/pacientes/formPaciente}"
							th:object="${paciente}" method="post"
							enctype="multipart/form-data" id="formPaciente">
							<!-- g-3 es el punto medio perfecto para mantener la línea de Profesionales pero ahorrar espacio -->
							<div class="row g-2">

								<div class="col-md-6">
									<label class="form-label fw-bold small text-dark">Apellido</label>
									<div class="input-group">
										<span class="input-group-text"><i
											class="fa-solid fa-address-book"></i></span> <input type="text"
											style="text-transform: uppercase;" th:field="*{apellido}"
											class="form-control"
											th:errorclass="'form-control is-invalid'" />
									</div>
									<div class="invalid-feedback d-block"
										th:if="${#fields.hasErrors('apellido')}"
										th:errors="*{apellido}"></div>
								</div>

								<div class="col-md-6">
									<label class="form-label fw-bold small text-dark">Nombre</label>
									<div class="input-group">
										<span class="input-group-text"><i
											class="fa-solid fa-user"></i></span> <input type="text"
											style="text-transform: uppercase;" th:field="*{nombre}"
											class="form-control"
											th:errorclass="'form-control is-invalid'" />
									</div>
									<div class="invalid-feedback d-block"
										th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
								</div>

								<div class="col-md-8">
									<label class="form-label fw-bold small text-dark">Email
										Institucional</label>
									<div class="input-group">
										<span class="input-group-text"><i
											class="fa-solid fa-envelope"></i></span> <input type="email"
											th:field="*{email}" class="form-control"
											th:errorclass="'form-control is-invalid'" />
									</div>
									<div class="invalid-feedback d-block"
										th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
								</div>

								<div class="col-md-4">
									<label class="form-label fw-bold small text-dark">Teléfono</label>
									<div class="input-group">
										<span class="input-group-text"><i
											class="fa-solid fa-phone"></i></span> <input type="text"
											th:field="*{telefono}" class="form-control" />
									</div>
									<div class="invalid-feedback d-block"
										th:if="${#fields.hasErrors('telefono')}"
										th:errors="*{telefono}"></div>
								</div>

								<div class="col-md-7">
									<label class="form-label fw-bold small text-dark">Domicilio</label>
									<div class="input-group">
										<span class="input-group-text"><i
											class="fa-solid fa-location-dot"></i></span> <input type="text"
											style="text-transform: uppercase;" th:field="*{domicilio}"
											class="form-control" />
									</div>
									<div class="invalid-feedback d-block"
										th:if="${#fields.hasErrors('domicilio')}"
										th:errors="*{domicilio}"></div>
								</div>

								<div class="col-md-5">
									<label class="form-label fw-bold small text-dark">Localidad</label>
									<div class="input-group">
										<span class="input-group-text"><i
											class="fa-solid fa-city"></i></span> <input type="text"
											style="text-transform: uppercase;" th:field="*{localidad}"
											class="form-control" />
									</div>
									<div class="invalid-feedback d-block"
										th:if="${#fields.hasErrors('localidad')}"
										th:errors="*{localidad}"></div>
								</div>

								<div class="col-md-4">
									<label class="form-label fw-bold small text-dark">Nº
										Socio / Afiliado</label>
									<div class="input-group">
										<span class="input-group-text"><i
											class="fa-solid fa-id-card-clip"></i></span> <input type="text"
											th:field="*{numeroSocio}" class="form-control" />
									</div>
									<div class="invalid-feedback d-block"
										th:if="${#fields.hasErrors('numeroSocio')}"
										th:errors="*{numeroSocio}"></div>
								</div>

								<div class="col-md-3">
									<label class="form-label fw-bold small text-dark">Nº
										DNI</label>
									<div class="input-group">
										<span class="input-group-text"><i
											class="fa-solid fa-fingerprint"></i></span> <input type="text"
											th:field="*{dni}" class="form-control" />
									</div>
									<div class="invalid-feedback d-block"
										th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
								</div>

								<div class="col-md-3 col-6">
									<label class="form-label fw-bold small text-dark">Fecha
										Nac</label>
									<div class="input-group">
										<span class="input-group-text"><i
											class="fa-solid fa-calendar-day"></i></span> <input type="date"
											th:field="*{createAt}" class="form-control"
											th:errorclass="'form-control is-invalid'" />
									</div>
									<div class="invalid-feedback d-block"
										th:if="${#fields.hasErrors('createAt')}"
										th:errors="*{createAt}"></div>
								</div>


								<div class="col-md-2 col-6">
									<label class="form-label fw-bold small text-dark">Estado</label>
									<select class="form-select" th:field="*{estado}">
										<option value="Activo">Activo</option>
										<option value="Inactivo">Inactivo</option>
									</select>
								</div>










								<!-- Foto Compacta -->
								<div class="col-12 mt-2">
									<div class="card bg-light border-dashed">
										<div class="row align-items-center g-2">
											<div class="col-auto">
												<div id="preview-container"
													class="bg-white border rounded shadow-sm d-flex align-items-center justify-content-center"
													style="width: 70px; height: 70px; overflow: hidden;">
													<img id="img-preview"
														th:src="${paciente.foto != null && !#strings.isEmpty(paciente.foto)} ? @{/uploads/{path}(path=${paciente.foto})} : ''"
														th:class="${paciente.foto != null && !#strings.isEmpty(paciente.foto)} ? 'img-fluid' : 'img-fluid d-none'"
														style="object-fit: cover; width: 100%; height: 100%;">
													<i id="img-icon"
														th:class="${paciente.foto != null && !#strings.isEmpty(paciente.foto)} ? 'd-none' : 'fa-solid fa-camera text-light fa-2x'"></i>
												</div>
											</div>
											<div class="col">
												<label class="form-label fw-bold small mb-1">Fotografía
													del Paciente</label> <input type="file" name="file" id="file"
													class="form-control form-control-sm" accept="image/*"
													onchange="previewImage(this)" />
											</div>
										</div>
									</div>
								</div>

								<!-- ACCIONES -->
								<div class="col-12 mt-2">
									<div class="d-flex gap-2">
										<button type="submit" id="btnGuardar"
											class="btn btn-success flex-grow-1 fw-bold shadow-sm py-2">
											<i class="fa-solid fa-save me-2"></i>GUARDAR PACIENTE
										</button>
										<a th:href="@{/pacientes/listarPaciente}"
											class="btn btn-outline-secondary px-4 fw-bold py-2">
											VOLVER </a>
									</div>
								</div>
							</div>
							<input type="hidden" th:field="*{foto}" />
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<footer th:replace="layout/layout :: footer "></footer>

	<script th:inline="javascript">
        function previewImage(input) {
            const preview = document.getElementById('img-preview');
            const icon = document.getElementById('img-icon');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.classList.remove('d-none');
                    if(icon) icon.classList.add('d-none');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
